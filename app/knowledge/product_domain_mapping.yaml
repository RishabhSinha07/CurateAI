# Product-Domain Mapping Configuration
#
# This file defines which products should belong to multiple knowledge graph domains.
# Products can have one primary domain and multiple secondary domains.
#
# Format:
#   sku: [primary_domain, secondary_domain_1, secondary_domain_2, ...]
#
# Guidelines:
# - First domain in array is the PRIMARY domain (main use case)
# - Additional domains are SECONDARY (additional benefits)
# - Only add secondary domains if the product genuinely addresses problems in that domain
# - Maximum 3-4 domains per product (avoid over-tagging)

