# =============================================================================
# NOTES FOR DOMAIN ASSIGNMENT
# =============================================================================
#
# When to add a secondary domain:
# ✓ Product contains key ingredients for that domain (check knowledge graph)
# ✓ Product description mentions benefits for that domain
# ✓ Scientific evidence supports use for that domain
# ✓ Users searching in that domain would benefit from seeing this product
#
# When NOT to add a secondary domain:
# ✗ Only tangential/minor benefit
# ✗ No relevant ingredients for that domain
# ✗ Would create confusion for users
# ✗ Product is too specialized for primary domain only
#
# Example Decision Tree:
# Q: Should "Daily Probiotic" be in skin_health_radiance?
# - Does it contain ingredients that treat skin problems? → Yes (probiotics reduce inflammation)
# - Would a user searching for "dull skin" benefit from this? → Yes (gut-skin axis)
# - Is there scientific evidence? → Yes (clinical trials on probiotics and acne/skin health)
# → Decision: YES, add skin_health_radiance as secondary domain
