# Rural Equipment Knowledge Graph
#
# This graph defines the domain knowledge for rural/agricultural equipment
# product recommendations. It uses a classification-only approach —
# subcategories as problem nodes with synonyms for intent matching,
# no interview questions or ingredient edges.
#
# STRUCTURE:
# - 16 parent categories (for grouping context)
# - 71 subcategory problem nodes (each a user goal/need)
# - No attributes, no edges (search is pure semantic + category filter)

metadata:
  domain: rural-equipment
  version: 1.0.0
  created_at: "2026-03-27"
  description: "Knowledge graph for rural and agricultural equipment recommendations"
  display_name: "Rural Equipment"
  persona: "You are an agricultural equipment specialist who helps farmers and rural workers find the right tools and machinery for their needs. You understand farming operations, land preparation, crop maintenance, harvesting, and post-harvest processing. You consider the user's specific task, farm size, and budget to recommend appropriate equipment."
  is_active: true
  parent_domain: null

