# Gut Health & Digestion Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on digestive health, microbiome balance, and gastrointestinal wellness.
#
# UPDATING THIS GRAPH:
# 1. Add new nodes under the appropriate section (problems, attributes, etc.)
# 2. Ensure all IDs are unique and use snake_case
# 3. Add edges to connect new nodes to existing ones
# 4. Run validation: python -m app.knowledge.validate gut_health_digestion
# 5. Reload graph in development: reload_graph('gut_health_digestion')

metadata:
  domain: gut_health_digestion
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for gut health & digestion nutraceutical recommendations"
  display_name: "Gut Health & Digestion"
  persona: "You are a gut health and digestive wellness specialist who helps users find science-backed nutraceutical supplements for improving digestion, nutrient absorption, and microbiome balance. You focus on probiotics, prebiotics, digestive enzymes, fibre, and gut-supportive nutrients that promote digestive comfort and overall gastrointestinal health. You consider dietary habits, lifestyle factors, and specific digestive concerns to provide personalized recommendations."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Consumer digestive health concerns and wellness goals
  # ============================================================================
  problems:
    - id: bloating
      name: "bloating"
      display_name: "Bloating & Gas"
      synonyms:
        - "bloated"
        - "gas"
        - "flatulence"
        - "abdominal distension"
        - "stomach bloating"
        - "feeling full"
        - "gassy"
      severity_levels: [mild, moderate, severe]
      description: "Uncomfortable swelling and gas accumulation in the digestive tract"

    - id: constipation
      name: "constipation"
      display_name: "Constipation"
      synonyms:
        - "irregular bowel movements"
        - "hard stools"
        - "difficulty passing stools"
        - "infrequent bowel movements"
        - "sluggish digestion"
      severity_levels: [mild, moderate, severe]
      description: "Difficulty or infrequency in passing stools"

    - id: acidity
      name: "acidity"
      display_name: "Acidity & Heartburn"
      synonyms:
        - "acid reflux"
        - "heartburn"
        - "GERD"
        - "burning sensation"
        - "sour stomach"
        - "indigestion"
      severity_levels: [mild, moderate, severe]
      description: "Excess stomach acid causing burning sensations and discomfort"

    - id: poor_digestion
      name: "poor_digestion"
      display_name: "Poor Digestion"
      synonyms:
        - "weak digestion"
        - "slow digestion"
        - "digestive discomfort"
        - "heavy feeling after meals"
        - "food sitting in stomach"
      severity_levels: [mild, moderate, severe]
      description: "Inefficient breakdown and processing of food"

    - id: diarrhea
      name: "diarrhea"
      display_name: "Diarrhea & Loose Stools"
      synonyms:
        - "loose stools"
        - "watery stools"
        - "frequent bowel movements"
        - "loose motions"
      severity_levels: [mild, moderate, severe]
      description: "Frequent loose or watery bowel movements"

    - id: ibs
      name: "ibs"
      display_name: "Irritable Bowel Syndrome (IBS)"
      synonyms:
        - "IBS"
        - "irritable bowel"
        - "spastic colon"
        - "IBS symptoms"
      severity_levels: [mild, moderate, severe]
      description: "Chronic digestive disorder with alternating constipation and diarrhea"

    - id: poor_absorption
      name: "poor_absorption"
      display_name: "Poor Nutrient Absorption"
      synonyms:
        - "malabsorption"
        - "nutrient deficiency"
        - "weak absorption"
        - "digestive inefficiency"
      severity_levels: [mild, moderate, severe]
      description: "Inability to properly absorb nutrients from food"

    - id: dysbiosis
      name: "dysbiosis"
      display_name: "Gut Dysbiosis & Microbiome Imbalance"
      synonyms:
        - "gut imbalance"
        - "bacterial imbalance"
        - "microbiome disruption"
        - "unhealthy gut flora"
        - "bad bacteria overgrowth"
      severity_levels: [mild, moderate, severe]
      description: "Imbalance in gut bacteria affecting overall digestive health"

    - id: leaky_gut
      name: "leaky_gut"
      display_name: "Leaky Gut Syndrome"
      synonyms:
        - "intestinal permeability"
        - "leaky intestines"
        - "gut barrier dysfunction"
      severity_levels: [mild, moderate, severe]
