# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # --------------------------------------------------------------------------
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  # Defines which attributes are needed to recommend solutions for a problem
  # --------------------------------------------------------------------------

  # Bloating requires knowing diet and fiber intake
  - source: bloating
    target: diet_vegetarian
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Dietary patterns affect gas production and microbiome composition"

  - source: bloating
    target: fiber_intake_low
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Fiber intake affects gas production and digestive patterns"

  # Constipation requires knowing fiber, water, and exercise
  - source: constipation
    target: fiber_intake_low
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Low fiber is a primary cause of constipation"

  - source: constipation
    target: water_intake_low
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Adequate hydration is essential for bowel regularity"

  - source: constipation
    target: exercise_sedentary
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Physical activity stimulates bowel movements"

  # Acidity requires knowing diet and stress
  - source: acidity
    target: diet_vegan
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Dietary choices affect stomach acid production"

  - source: acidity
    target: lifestyle_high_stress
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Stress is a major trigger for acid reflux"

  # Poor Digestion requires knowing age and diet
  - source: poor_digestion
    target: age_group_46_plus
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Digestive enzyme production decreases with age"

  - source: poor_digestion
    target: diet_non_veg
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Protein and fat intake affect enzyme requirements"

  # Diarrhea requires knowing recent antibiotic use
