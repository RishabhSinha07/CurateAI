    strength_levels:
    - 400mg
    - 800mg
    - 1200mg
    description: Helps cartilage retain water and resist compression
  - id: msm
    name: msm
    display_name: MSM (Methylsulfonylmethane)
    function: joint_pain_inflammation_reduction
    category: joint_support
    strength_levels:
    - 1000mg
    - 1500mg
    - 2000mg
    description: Sulfur compound reducing joint pain and inflammation
  - id: hyaluronic_acid
    name: hyaluronic_acid
    display_name: Hyaluronic Acid
    function: joint_lubrication_fluid
    category: joint_support
    strength_levels:
    - 50mg
    - 100mg
    - 200mg
    description: Component of synovial fluid for joint lubrication
  - id: magnesium_bone
    name: magnesium_bone
    display_name: Magnesium
    function: bone_structure_vitamin_d_activation
    category: minerals
    strength_levels:
    - 200mg
    - 400mg
    - 500mg
    description: Critical for bone structure and vitamin D activation
  - id: zinc_bone
    name: zinc_bone
    display_name: Zinc
    function: bone_formation_collagen_synthesis
    category: minerals
    strength_levels:
    - 15mg
    - 30mg
    description: Required for bone formation and collagen production
  - id: boron
    name: boron
    display_name: Boron
    function: calcium_vitamin_d_metabolism
    category: minerals
    strength_levels:
    - 3mg
    - 6mg
    - 9mg
    description: Supports calcium and vitamin D metabolism
  - id: silicon
    name: silicon
    display_name: Silicon
    function: bone_collagen_formation
    category: minerals
    strength_levels:
    - 5mg
    - 10mg
    description: Essential for bone and collagen formation
  - id: strontium
    name: strontium
    display_name: Strontium
    function: bone_density_formation
    category: minerals
    strength_levels:
    - 340mg
    - 680mg
    description: Increases bone density and reduces resorption
  - id: omega_3_joint
