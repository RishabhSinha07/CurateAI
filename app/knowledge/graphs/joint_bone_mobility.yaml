metadata:
  domain: joint_bone_mobility
  version: 1.0.0
  created_at: '2026-01-31'
  description: Knowledge graph for bone health, joint support, mobility, and musculoskeletal
    wellness
  display_name: Joint, Bone & Mobility
  persona: You are a bone and joint health specialist who helps users maintain strong
    bones, support joint comfort, and optimize mobility. You focus on evidence-based
    nutrients for skeletal health, cartilage support, and inflammation reduction.
  is_active: true
  parent_domain: null
nodes:
  problems:
  - id: joint_pain
    name: joint_pain
    display_name: Joint Pain & Discomfort
    synonyms:
    - painful joints
    - joint aches
    - joint discomfort
    - aching joints
    severity_levels:
    - mild
    - moderate
    - severe
    description: Pain or discomfort in one or more joints
  - id: joint_stiffness
    name: joint_stiffness
    display_name: Joint Stiffness
    synonyms:
    - stiff joints
    - morning stiffness
    - reduced flexibility
    - tight joints
    severity_levels:
    - mild
    - moderate
    - severe
    description: Reduced range of motion and flexibility in joints
  - id: osteoarthritis
    name: osteoarthritis
    display_name: Osteoarthritis
    synonyms:
    - arthritis
    - wear and tear arthritis
    - degenerative joint disease
    severity_levels:
    - mild
    - moderate
    - severe
    description: Degenerative joint condition causing cartilage breakdown
  - id: low_bone_density
    name: low_bone_density
    display_name: Low Bone Density
    synonyms:
    - osteopenia
    - weak bones
    - bone loss
    - low bone mass
    severity_levels:
    - mild
    - moderate
    - severe
    description: Reduced bone mineral density below optimal levels
  - id: osteoporosis
    name: osteoporosis
    display_name: Osteoporosis
    synonyms:
    - brittle bones
    - porous bones
    - severe bone loss
    severity_levels:
    - mild
    - moderate
    - severe
    description: Severe bone density loss increasing fracture risk
  - id: limited_mobility
    name: limited_mobility
    display_name: Limited Mobility & Movement
    synonyms:
    - reduced mobility
    - difficulty moving
    - movement limitation
    - can't move freely
    severity_levels:
    - mild
    - moderate
    - severe
    description: Reduced ability to move joints and perform daily activities
  - id: inflammation_joints
    name: inflammation_joints
    display_name: Joint Inflammation
    synonyms:
    - inflamed joints
    - swollen joints
    - joint swelling
    severity_levels:
    - mild
    - moderate
    - severe
    description: Inflammatory response in joint tissues
  - id: cartilage_degradation
    name: cartilage_degradation
    display_name: Cartilage Loss & Degradation
    synonyms:
    - worn cartilage
    - cartilage breakdown
    - cartilage loss
    severity_levels:
    - mild
    - moderate
    - severe
    description: Progressive loss of protective joint cartilage
  - id: fracture_risk
    name: fracture_risk
    display_name: High Fracture Risk
    synonyms:
    - prone to fractures
    - fragile bones
    - fracture susceptibility
    severity_levels:
    - mild
    - moderate
    - severe
    description: Increased susceptibility to bone fractures
