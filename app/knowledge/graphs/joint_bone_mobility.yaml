# Joint, Bone & Mobility Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on bone health, joint comfort, mobility, and musculoskeletal support.

metadata:
  domain: joint_bone_mobility
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for bone health, joint support, mobility, and musculoskeletal wellness"
  display_name: "Joint, Bone & Mobility"
  persona: "You are a bone and joint health specialist who helps users maintain strong bones, support joint comfort, and optimize mobility. You focus on evidence-based nutrients for skeletal health, cartilage support, and inflammation reduction."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Joint and bone health challenges
  # ============================================================================
  problems:
    - id: joint_pain
      name: "joint_pain"
      display_name: "Joint Pain & Discomfort"
      synonyms:
        - "painful joints"
        - "joint aches"
        - "joint discomfort"
        - "aching joints"
      severity_levels: [mild, moderate, severe]
      description: "Pain or discomfort in one or more joints"

    - id: joint_stiffness
      name: "joint_stiffness"
      display_name: "Joint Stiffness"
      synonyms:
        - "stiff joints"
        - "morning stiffness"
        - "reduced flexibility"
        - "tight joints"
      severity_levels: [mild, moderate, severe]
      description: "Reduced range of motion and flexibility in joints"

    - id: osteoarthritis
      name: "osteoarthritis"
      display_name: "Osteoarthritis"
      synonyms:
        - "arthritis"
        - "wear and tear arthritis"
        - "degenerative joint disease"
      severity_levels: [mild, moderate, severe]
      description: "Degenerative joint condition causing cartilage breakdown"

    - id: low_bone_density
      name: "low_bone_density"
      display_name: "Low Bone Density"
      synonyms:
        - "osteopenia"
        - "weak bones"
        - "bone loss"
        - "low bone mass"
      severity_levels: [mild, moderate, severe]
      description: "Reduced bone mineral density below optimal levels"

    - id: osteoporosis
      name: "osteoporosis"
      display_name: "Osteoporosis"
      synonyms:
        - "brittle bones"
        - "porous bones"
        - "severe bone loss"
      severity_levels: [mild, moderate, severe]
      description: "Severe bone density loss increasing fracture risk"

    - id: limited_mobility
      name: "limited_mobility"
      display_name: "Limited Mobility & Movement"
      synonyms:
        - "reduced mobility"
        - "difficulty moving"
        - "movement limitation"
        - "can't move freely"
      severity_levels: [mild, moderate, severe]
      description: "Reduced ability to move joints and perform daily activities"

    - id: inflammation_joints
      name: "inflammation_joints"
      display_name: "Joint Inflammation"
      synonyms:
        - "inflamed joints"
        - "swollen joints"
        - "joint swelling"
      severity_levels: [mild, moderate, severe]
      description: "Inflammatory response in joint tissues"

    - id: cartilage_degradation
      name: "cartilage_degradation"
      display_name: "Cartilage Loss & Degradation"
      synonyms:
        - "worn cartilage"
        - "cartilage breakdown"
        - "cartilage loss"
      severity_levels: [mild, moderate, severe]
      description: "Progressive loss of protective joint cartilage"

    - id: fracture_risk
      name: "fracture_risk"
      display_name: "High Fracture Risk"
      synonyms:
        - "prone to fractures"
        - "fragile bones"
        - "fracture susceptibility"
      severity_levels: [mild, moderate, severe]
      description: "Increased susceptibility to bone fractures"

  # ============================================================================
  # ATTRIBUTES - User context for personalization
  # ============================================================================
  attributes:
    # Demographic
    - id: age_group
      name: "age_group"
      display_name: "Age Group"
      type: categorical
      values:
        - 18_35
        - 36_45
        - 46_55
        - 56_65
        - 65_plus
      required: true
      description: "Age range (bone health varies with age)"

    - id: gender
      name: "gender"
      display_name: "Gender"
      type: categorical
      values:
        - female
        - male
        - other
      required: true
      description: "Gender (women at higher osteoporosis risk)"

    - id: menopause_status
      name: "menopause_status"
      display_name: "Menopause Status"
      type: categorical
      values:
        - premenopausal
        - perimenopausal
        - postmenopausal
        - not_applicable
      required: false
      description: "Menopause increases bone loss risk"

    # Lifestyle factors
    - id: sun_exposure
      name: "sun_exposure"
      display_name: "Sun Exposure"
      type: categorical
      values:
        - minimal
        - moderate
        - high
      required: true
      description: "Sunlight exposure for vitamin D production"

    - id: calcium_intake
      name: "calcium_intake"
      display_name: "Dietary Calcium Intake"
      type: categorical
      values:
        - very_low
        - low
        - moderate
        - adequate
        - high
      required: true
      description: "Daily calcium consumption from diet"

    - id: dairy_consumption
      name: "dairy_consumption"
      display_name: "Dairy Consumption"
      type: categorical
      values:
        - none_vegan
        - minimal
        - moderate
        - high
      required: false
      description: "Dairy product intake (primary calcium source)"

    - id: exercise_type
      name: "exercise_type"
      display_name: "Exercise Type"
      type: categorical
      values:
        - sedentary
        - walking_low_impact
        - weight_bearing
        - high_impact
      required: true
      description: "Weight-bearing exercise strengthens bones"

    - id: smoking_status
      name: "smoking_status"
      display_name: "Smoking Status"
      type: categorical
      values:
        - never
        - former
        - current
      required: false
      description: "Smoking reduces bone density"

    - id: alcohol_consumption
      name: "alcohol_consumption"
      display_name: "Alcohol Consumption"
      type: categorical
      values:
        - none
        - occasional
        - moderate
        - frequent
      required: false
      description: "Excessive alcohol impairs bone health"

    # Health history
    - id: family_history_osteoporosis
      name: "family_history_osteoporosis"
      display_name: "Family History of Osteoporosis"
      type: categorical
      values:
        - yes
        - no
        - unknown
      required: false
      description: "Genetic predisposition to bone loss"

    - id: previous_fractures
      name: "previous_fractures"
      display_name: "History of Fractures"
      type: categorical
      values:
        - none
        - one_fracture
        - multiple_fractures
      required: false
      description: "Prior fractures indicate bone fragility"

  # ============================================================================
  # INGREDIENTS - Bone and joint supporting nutrients
  # ============================================================================
  ingredients:
    # CALCIUM
    - id: calcium_carbonate
      name: "calcium_carbonate"
      display_name: "Calcium Carbonate"
      function: "bone_mineralization_density"
      category: "minerals"
      strength_levels: ["500mg", "1000mg", "1200mg"]
      description: "Most concentrated calcium form, best with food"

    - id: calcium_citrate
      name: "calcium_citrate"
      display_name: "Calcium Citrate"
      function: "highly_absorbable_bone_support"
      category: "minerals"
      strength_levels: ["500mg", "1000mg"]
      description: "More bioavailable, can take without food"

    # VITAMIN D & K
    - id: vitamin_d3_bone
      name: "vitamin_d3_bone"
      display_name: "Vitamin D3 (Cholecalciferol)"
      function: "calcium_absorption_bone_health"
      category: "vitamins"
      strength_levels: ["1000IU", "2000IU", "5000IU"]
      description: "Essential for calcium absorption and bone mineralization"

    - id: vitamin_k2_mk7
      name: "vitamin_k2_mk7"
      display_name: "Vitamin K2 (MK-7)"
      function: "calcium_deposition_bone_matrix"
      category: "vitamins"
      strength_levels: ["45mcg", "90mcg", "180mcg"]
      description: "Directs calcium to bones and away from arteries"

    - id: d3_k2_combo
      name: "d3_k2_combo"
      display_name: "Vitamin D3 + K2 Combo"
      function: "synergistic_bone_health"
      category: "vitamins"
      description: "Synergistic combination for optimal bone health"

    # COLLAGEN
    - id: collagen_type_ii
      name: "collagen_type_ii"
      display_name: "Collagen Type II (UC-II)"
      function: "cartilage_support_joint_comfort"
      category: "collagen"
      strength_levels: ["40mg", "100mg"]
      description: "Specific for cartilage and joint health"

    - id: marine_collagen_bone
      name: "marine_collagen_bone"
      display_name: "Marine Collagen (Type I)"
      function: "bone_matrix_support"
      category: "collagen"
      strength_levels: ["5g", "10g", "15g"]
      description: "Type I collagen for bone matrix structure"

    - id: hydrolyzed_collagen
      name: "hydrolyzed_collagen"
      display_name: "Hydrolyzed Collagen Peptides"
      function: "joint_bone_connective_tissue"
      category: "collagen"
      strength_levels: ["10g", "15g", "20g"]
      description: "Easily absorbed collagen for joints and bones"

    # JOINT SUPPORT
    - id: glucosamine
      name: "glucosamine"
      display_name: "Glucosamine Sulfate"
      function: "cartilage_building_joint_support"
      category: "joint_support"
      strength_levels: ["750mg", "1500mg"]
      description: "Building block for cartilage and joint fluid"

    - id: chondroitin
      name: "chondroitin"
      display_name: "Chondroitin Sulfate"
      function: "cartilage_retention_joint_lubrication"
      category: "joint_support"
      strength_levels: ["400mg", "800mg", "1200mg"]
      description: "Helps cartilage retain water and resist compression"

    - id: msm
      name: "msm"
      display_name: "MSM (Methylsulfonylmethane)"
      function: "joint_pain_inflammation_reduction"
      category: "joint_support"
      strength_levels: ["1000mg", "1500mg", "2000mg"]
      description: "Sulfur compound reducing joint pain and inflammation"

    - id: hyaluronic_acid
      name: "hyaluronic_acid"
      display_name: "Hyaluronic Acid"
      function: "joint_lubrication_fluid"
      category: "joint_support"
      strength_levels: ["50mg", "100mg", "200mg"]
      description: "Component of synovial fluid for joint lubrication"

    # MINERALS
    - id: magnesium_bone
      name: "magnesium_bone"
      display_name: "Magnesium"
      function: "bone_structure_vitamin_d_activation"
      category: "minerals"
      strength_levels: ["200mg", "400mg", "500mg"]
      description: "Critical for bone structure and vitamin D activation"

    - id: zinc_bone
      name: "zinc_bone"
      display_name: "Zinc"
      function: "bone_formation_collagen_synthesis"
      category: "minerals"
      strength_levels: ["15mg", "30mg"]
      description: "Required for bone formation and collagen production"

    - id: boron
      name: "boron"
      display_name: "Boron"
      function: "calcium_vitamin_d_metabolism"
      category: "minerals"
      strength_levels: ["3mg", "6mg", "9mg"]
      description: "Supports calcium and vitamin D metabolism"

    - id: silicon
      name: "silicon"
      display_name: "Silicon"
      function: "bone_collagen_formation"
      category: "minerals"
      strength_levels: ["5mg", "10mg"]
      description: "Essential for bone and collagen formation"

    - id: strontium
      name: "strontium"
      display_name: "Strontium"
      function: "bone_density_formation"
      category: "minerals"
      strength_levels: ["340mg", "680mg"]
      description: "Increases bone density and reduces resorption"

    # OMEGA-3
    - id: omega_3_joint
      name: "omega_3_joint"
      display_name: "Omega-3 (EPA/DHA)"
      function: "joint_inflammation_reduction"
      category: "fatty_acids"
      strength_levels: ["1000mg", "2000mg", "3000mg"]
      description: "Reduces joint inflammation and pain"

    # ANTI-INFLAMMATORY BOTANICALS
    - id: curcumin_joint
      name: "curcumin_joint"
      display_name: "Curcumin (Turmeric)"
      function: "anti_inflammatory_joint_pain"
      category: "botanicals"
      strength_levels: ["500mg", "1000mg"]
      description: "Powerful anti-inflammatory for joint pain"

    - id: boswellia
      name: "boswellia"
      display_name: "Boswellia Serrata"
      function: "joint_inflammation_pain_reduction"
      category: "botanicals"
      strength_levels: ["250mg", "500mg"]
      standardization: "65% boswellic acids"
      description: "Ayurvedic herb reducing joint inflammation"

    - id: ginger_extract
      name: "ginger_extract"
      display_name: "Ginger Extract"
      function: "anti_inflammatory_joint_support"
      category: "botanicals"
      strength_levels: ["250mg", "500mg"]
      description: "Natural anti-inflammatory for joint comfort"

  # ============================================================================
  # CONSTRAINTS - Safety and contraindications
  # ============================================================================
  constraints:
    - id: kidney_stones
      name: "kidney_stones"
      display_name: "History of Kidney Stones"
      severity: high
      description: "Calcium supplementation risk"

    - id: hypercalcemia
      name: "hypercalcemia"
      display_name: "High Blood Calcium"
      severity: high
      description: "Elevated calcium levels"

    - id: shellfish_allergy
      name: "shellfish_allergy"
      display_name: "Shellfish Allergy"
      severity: high
      description: "Glucosamine often derived from shellfish"

    - id: blood_thinners
      name: "blood_thinners"
      display_name: "Blood Thinning Medication"
      severity: high
      description: "Interactions with vitamin K, omega-3, ginger"

    - id: pregnancy
      name: "pregnancy"
      display_name: "Pregnancy"
      severity: moderate
      description: "Currently pregnant"

# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  problem_requires_attributes:
    - from: joint_pain
      to: [age_group, exercise_type, previous_fractures]
      relationship: REQUIRES_KNOWING

    - from: osteoarthritis
      to: [age_group, exercise_type, calcium_intake]
      relationship: REQUIRES_KNOWING

    - from: low_bone_density
      to: [age_group, gender, menopause_status, sun_exposure, calcium_intake]
      relationship: REQUIRES_KNOWING

    - from: osteoporosis
      to: [age_group, gender, menopause_status, family_history_osteoporosis, smoking_status]
      relationship: REQUIRES_KNOWING

  # INGREDIENT → TREATS → PROBLEM
  ingredient_treats_problem:
    # Calcium for bone health
    - from: calcium_carbonate
      to: low_bone_density
      relationship: TREATS
      efficacy: 0.85
      mechanism: "Provides calcium for bone mineralization and density"
      evidence_level: "meta_analysis"
      onset: "6-12 months"

    - from: calcium_carbonate
      to: osteoporosis
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Slows bone loss and increases bone density"
      evidence_level: "clinical_trial"
      onset: "12-24 months"

    # Vitamin D3 for calcium absorption
    - from: vitamin_d3_bone
      to: low_bone_density
      relationship: TREATS
      efficacy: 0.85
      mechanism: "Essential for calcium absorption and bone mineralization"
      evidence_level: "meta_analysis"
      onset: "6-12 months"

    - from: vitamin_d3_bone
      to: fracture_risk
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Improves bone strength and reduces fall risk"
      evidence_level: "clinical_trial"
      onset: "12 months"

    # Vitamin K2 for bone quality
    - from: vitamin_k2_mk7
      to: low_bone_density
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Activates osteocalcin to bind calcium to bone matrix"
      evidence_level: "clinical_trial"
      onset: "6-12 months"

    # Collagen for cartilage and bones
    - from: collagen_type_ii
      to: joint_pain
      relationship: TREATS
      efficacy: 0.80
      mechanism: "UC-II supports cartilage health and reduces joint pain"
      evidence_level: "clinical_trial"
      onset: "8-12 weeks"

    - from: collagen_type_ii
      to: osteoarthritis
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Reduces cartilage degradation in osteoarthritis"
      evidence_level: "clinical_trial"
      onset: "8-16 weeks"

    - from: marine_collagen_bone
      to: low_bone_density
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Type I collagen is primary protein in bone matrix"
      evidence_level: "clinical_trial"
      onset: "12-24 weeks"

    # Glucosamine/Chondroitin for joints
    - from: glucosamine
      to: joint_pain
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Building block for cartilage synthesis"
      evidence_level: "meta_analysis"
      onset: "4-8 weeks"

    - from: glucosamine
      to: osteoarthritis
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Slows cartilage breakdown in osteoarthritis"
      evidence_level: "meta_analysis"
      onset: "8-12 weeks"

    - from: chondroitin
      to: joint_pain
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Helps cartilage retain water and elasticity"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    # MSM for joint inflammation
    - from: msm
      to: joint_pain
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Reduces inflammatory compounds in joints"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    - from: msm
      to: joint_stiffness
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Improves joint flexibility and range of motion"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    # Omega-3 for joint inflammation
    - from: omega_3_joint
      to: joint_pain
      relationship: TREATS
      efficacy: 0.75
      mechanism: "EPA/DHA reduce inflammatory prostaglandins"
      evidence_level: "meta_analysis"
      onset: "4-8 weeks"

    - from: omega_3_joint
      to: inflammation_joints
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Powerful anti-inflammatory effects in joint tissue"
      evidence_level: "clinical_trial"
      onset: "4-12 weeks"

    # Curcumin for joint pain
    - from: curcumin_joint
      to: joint_pain
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Blocks inflammatory pathways comparable to NSAIDs"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    - from: curcumin_joint
      to: osteoarthritis
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Reduces inflammation and pain in osteoarthritis"
      evidence_level: "clinical_trial"
      onset: "8-12 weeks"

    # Boswellia for inflammation
    - from: boswellia
      to: joint_pain
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Inhibits inflammatory enzymes in joints"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    - from: boswellia
      to: osteoarthritis
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Reduces pain and improves function in osteoarthritis"
      evidence_level: "clinical_trial"
      onset: "8-12 weeks"

    # Magnesium for bone health
    - from: magnesium_bone
      to: low_bone_density
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Critical for bone structure and vitamin D activation"
      evidence_level: "clinical_trial"
      onset: "6-12 months"

  # INGREDIENT → RECOMMENDED_FOR → ATTRIBUTE
  ingredient_recommended_for_attribute:
    - from: calcium_carbonate
      to: [calcium_intake:very_low, calcium_intake:low, dairy_consumption:none_vegan]
      relationship: RECOMMENDED_FOR

    - from: vitamin_d3_bone
      to: [sun_exposure:minimal, age_group:56_65, age_group:65_plus]
      relationship: RECOMMENDED_FOR

    - from: vitamin_k2_mk7
      to: [age_group:46_55, age_group:56_65, age_group:65_plus]
      relationship: RECOMMENDED_FOR

    - from: collagen_type_ii
      to: [joint_pain, osteoarthritis, age_group:46_55, age_group:56_65]
      relationship: RECOMMENDED_FOR

    - from: glucosamine
      to: [joint_pain, osteoarthritis, age_group:46_55]
      relationship: RECOMMENDED_FOR

  # INGREDIENT → CONTRAINDICATED_FOR → CONSTRAINT
  ingredient_contraindications:
    - from: calcium_carbonate
      to: kidney_stones
      relationship: CONTRAINDICATED_FOR
      severity: caution

    - from: calcium_carbonate
      to: hypercalcemia
      relationship: CONTRAINDICATED_FOR
      severity: avoid

    - from: glucosamine
      to: shellfish_allergy
      relationship: CONTRAINDICATED_FOR
      severity: caution

    - from: vitamin_k2_mk7
      to: blood_thinners
      relationship: CONTRAINDICATED_FOR
      severity: caution

    - from: omega_3_joint
      to: blood_thinners
      relationship: CONTRAINDICATED_FOR
      severity: caution

  # PROBLEM → SIMILAR_TO → PROBLEM
  problem_similarities:
    - from: low_bone_density
      to: osteoporosis
      relationship: SIMILAR_TO

    - from: joint_pain
      to: osteoarthritis
      relationship: SIMILAR_TO

  # PROBLEM → OFTEN_PAIRED_WITH → PROBLEM
  problem_co_occurrence:
    - from: joint_pain
      to: joint_stiffness
      relationship: OFTEN_PAIRED_WITH

    - from: osteoarthritis
      to: limited_mobility
      relationship: OFTEN_PAIRED_WITH

    - from: low_bone_density
      to: fracture_risk
      relationship: OFTEN_PAIRED_WITH
