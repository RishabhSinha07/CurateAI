      onset: "2-4 weeks"

    # Apple Cider Vinegar
    - from: apple_cider_vinegar
      to: difficulty_losing_weight
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Acetic acid improves insulin sensitivity and satiety"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    - from: apple_cider_vinegar
      to: blood_sugar_imbalance
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Reduces post-meal glucose spikes"
      evidence_level: "clinical_trial"
      onset: "1-2 weeks"

    # Garcinia Cambogia
    - from: garcinia_cambogia
      to: uncontrolled_appetite
      relationship: TREATS
      efficacy: 0.70
