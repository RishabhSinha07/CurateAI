# Hormonal Balance Knowledge Graph
# Domain: hormonal_balance
# Focus: Hormone regulation, PCOS, PMS, menopause, reproductive health

domain:
  slug: hormonal_balance
  name: "Hormonal Balance"
  description: "Support for hormone regulation across life stages including PCOS, PMS, and menopause"

# =============================================================================
# PROBLEM NODES - User health concerns
# =============================================================================
problems:
  - id: pcos
    label: "PCOS (Polycystic Ovary Syndrome)"
    description: "Hormonal disorder causing irregular periods, insulin resistance, and elevated androgens"
    symptoms: ["irregular periods", "acne", "hirsutism", "weight gain", "insulin resistance"]
    severity: "moderate_to_severe"

  - id: pms_symptoms
    label: "PMS (Premenstrual Syndrome)"
    description: "Physical and emotional symptoms before menstruation"
    symptoms: ["mood swings", "bloating", "breast tenderness", "cramps", "fatigue", "irritability"]
    severity: "mild_to_moderate"

  - id: menopause_symptoms
    label: "Menopause Symptoms"
    description: "Hot flashes, night sweats, mood changes during menopause transition"
    symptoms: ["hot flashes", "night sweats", "mood swings", "sleep disturbance", "vaginal dryness"]
    severity: "moderate_to_severe"

  - id: irregular_periods
    label: "Irregular Menstrual Cycles"
    description: "Unpredictable period timing, heavy or light flow"
    symptoms: ["missed periods", "heavy bleeding", "spotting", "cycle length variation"]
    severity: "moderate"

  - id: hormonal_acne
    label: "Hormonal Acne"
    description: "Acne driven by hormonal fluctuations, especially around jawline and chin"
    symptoms: ["cystic acne", "jawline breakouts", "premenstrual acne", "adult acne"]
    severity: "mild_to_moderate"

  - id: low_libido
    label: "Low Sex Drive"
    description: "Reduced sexual desire often linked to hormonal imbalance"
    symptoms: ["decreased libido", "low arousal", "sexual dysfunction"]
    severity: "moderate"

  - id: estrogen_dominance
    label: "Estrogen Dominance"
    description: "Excess estrogen relative to progesterone causing various symptoms"
    symptoms: ["heavy periods", "breast tenderness", "mood swings", "weight gain", "fibroids"]
    severity: "moderate"

  - id: thyroid_imbalance
    label: "Thyroid Dysfunction"
    description: "Hypothyroid or hyperthyroid symptoms affecting metabolism and energy"
    symptoms: ["fatigue", "weight changes", "hair loss", "cold intolerance", "brain fog"]
    severity: "moderate_to_severe"

  - id: fertility_issues
    label: "Fertility Challenges"
    description: "Difficulty conceiving related to hormonal imbalances"
    symptoms: ["anovulation", "luteal phase defect", "poor egg quality", "implantation failure"]
    severity: "severe"

# =============================================================================
# ATTRIBUTE NODES - User characteristics that inform recommendations
# =============================================================================
attributes:
  - id: life_stage
    label: "Life Stage"
    type: "categorical"
    values: ["reproductive_age", "perimenopause", "menopause", "postmenopause", "trying_to_conceive"]

  - id: menstrual_cycle_regularity
    label: "Menstrual Cycle Regularity"
    type: "categorical"
    values: ["regular", "irregular", "absent", "heavy", "light"]

  - id: diagnosed_conditions
    label: "Diagnosed Hormonal Conditions"
    type: "multi_select"
    values: ["pcos", "endometriosis", "hypothyroidism", "hyperthyroidism", "pmdd", "none"]

  - id: hormonal_contraception
    label: "Using Hormonal Birth Control"
    type: "boolean"

  - id: pregnancy_status
    label: "Pregnancy Status"
    type: "categorical"
    values: ["not_pregnant", "trying_to_conceive", "pregnant", "breastfeeding"]

# =============================================================================
# INGREDIENT NODES - Supplements and nutrients
# =============================================================================
ingredients:
  # INOSITOL (Critical for PCOS and insulin sensitivity)
  - id: myo_inositol
    label: "Myo-Inositol"
    category: "supplement"
    forms: ["powder", "capsule"]
    typical_dose: "2000-4000mg daily"

  - id: d_chiro_inositol
    label: "D-Chiro-Inositol"
    category: "supplement"
    forms: ["capsule"]
    typical_dose: "50-100mg daily (40:1 ratio with myo-inositol)"

  # ADAPTOGENS
  - id: ashwagandha_hormonal
    label: "Ashwagandha (Withania somnifera)"
    category: "adaptogen"
    forms: ["extract", "powder"]
    typical_dose: "300-600mg standardized extract"

  - id: vitex
    label: "Vitex (Chasteberry)"
    category: "herb"
    forms: ["extract", "capsule"]
    typical_dose: "400-1000mg daily"

  - id: maca
    label: "Maca Root"
    category: "adaptogen"
    forms: ["powder", "extract"]
    typical_dose: "1500-3000mg daily"

  # MENOPAUSE SUPPORT
  - id: black_cohosh
    label: "Black Cohosh"
    category: "herb"
    forms: ["extract", "capsule"]
    typical_dose: "40-80mg standardized extract"

  - id: red_clover
    label: "Red Clover"
    category: "herb"
    forms: ["extract", "capsule"]
    typical_dose: "40-80mg isoflavones"

  # HORMONE METABOLISM
  - id: dim
    label: "DIM (Diindolylmethane)"
    category: "supplement"
    forms: ["capsule"]
    typical_dose: "100-200mg daily"

  - id: calcium_d_glucarate
    label: "Calcium D-Glucarate"
    category: "supplement"
    forms: ["capsule"]
    typical_dose: "500-1000mg daily"

  # ESSENTIAL FATTY ACIDS
  - id: evening_primrose_oil
    label: "Evening Primrose Oil"
    category: "omega"
    forms: ["softgel"]
    typical_dose: "1000-3000mg daily (GLA)"

  - id: omega3_hormonal
    label: "Omega-3 (EPA/DHA)"
    category: "omega"
    forms: ["fish oil", "algae oil"]
    typical_dose: "1000-2000mg combined EPA/DHA"

  # MINERALS
  - id: zinc_hormonal
    label: "Zinc"
    category: "mineral"
    forms: ["citrate", "picolinate", "glycinate"]
    typical_dose: "15-30mg daily"

  - id: magnesium_hormonal
    label: "Magnesium"
    category: "mineral"
    forms: ["glycinate", "citrate", "threonate"]
    typical_dose: "300-400mg daily"

  - id: selenium
    label: "Selenium"
    category: "mineral"
    forms: ["selenomethionine"]
    typical_dose: "100-200mcg daily"

  - id: iodine
    label: "Iodine"
    category: "mineral"
    forms: ["kelp", "potassium iodide"]
    typical_dose: "150-300mcg daily"

  # VITAMINS
  - id: vitamin_b6_hormonal
    label: "Vitamin B6 (Pyridoxine)"
    category: "vitamin"
    forms: ["P5P", "pyridoxine HCl"]
    typical_dose: "50-100mg daily"

  - id: vitamin_d_hormonal
    label: "Vitamin D3"
    category: "vitamin"
    forms: ["cholecalciferol"]
    typical_dose: "2000-4000 IU daily"

  - id: vitamin_e
    label: "Vitamin E"
    category: "vitamin"
    forms: ["mixed tocopherols"]
    typical_dose: "400-800 IU daily"

  - id: folate_hormonal
    label: "Folate (Methylfolate)"
    category: "vitamin"
    forms: ["5-MTHF", "folic acid"]
    typical_dose: "400-800mcg daily"

  # ANTIOXIDANTS
  - id: nac
    label: "N-Acetyl Cysteine (NAC)"
    category: "antioxidant"
    forms: ["capsule"]
    typical_dose: "600-1200mg daily"

  - id: coq10_hormonal
    label: "Coenzyme Q10"
    category: "antioxidant"
    forms: ["ubiquinol", "ubiquinone"]
    typical_dose: "100-300mg daily"

# =============================================================================
# CONSTRAINT NODES - Safety considerations
# =============================================================================
constraints:
  - id: pregnancy_contraindication
    label: "Not Safe During Pregnancy"
    type: "contraindication"
    severity: "critical"
    applies_to: ["vitex", "black_cohosh", "ashwagandha_hormonal", "maca"]

  - id: breastfeeding_caution
    label: "Caution During Breastfeeding"
    type: "contraindication"
    severity: "moderate"
    applies_to: ["vitex", "black_cohosh", "maca"]

  - id: hormone_sensitive_conditions
    label: "Caution with Hormone-Sensitive Cancers"
    type: "contraindication"
    severity: "high"
    applies_to: ["black_cohosh", "red_clover", "maca"]

  - id: thyroid_medication_interaction
    label: "May Interact with Thyroid Medication"
    type: "interaction"
    severity: "moderate"
    applies_to: ["ashwagandha_hormonal", "iodine", "selenium"]

# =============================================================================
# EDGES - Relationships between nodes
# =============================================================================
edges:
  # INOSITOL FOR PCOS
  - from: myo_inositol
    to: pcos
    relationship: TREATS
    efficacy: 0.85
    mechanism: "Improves insulin sensitivity, reduces androgens, restores ovulation"
    evidence_level: "meta_analysis"
    onset: "3-6 months"

  - from: myo_inositol
    to: fertility_issues
    relationship: TREATS
    efficacy: 0.80
    mechanism: "Improves egg quality and ovulation in PCOS patients"
    evidence_level: "clinical_trial"
    onset: "3-6 months"

  - from: d_chiro_inositol
    to: pcos
    relationship: TREATS
    efficacy: 0.75
    mechanism: "Complements myo-inositol in 40:1 ratio for insulin signaling"
    evidence_level: "clinical_trial"
    onset: "3-6 months"

  # VITEX FOR PMS AND IRREGULAR CYCLES
  - from: vitex
    to: pms_symptoms
