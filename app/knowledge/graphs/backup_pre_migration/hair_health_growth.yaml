# Hair Health & Growth Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on hair health, hair fall reduction, growth, and thickness improvement.
#
# UPDATING THIS GRAPH:
# 1. Add new nodes under the appropriate section (problems, attributes, etc.)
# 2. Ensure all IDs are unique and use snake_case
# 3. Add edges to connect new nodes to existing ones
# 4. Run validation: python -m app.knowledge.validate hair_health_growth
# 5. Reload graph in development: reload_graph('hair_health_growth')

metadata:
  domain: hair_health_growth
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for hair health & growth nutraceutical recommendations"
  display_name: "Hair Health & Growth"
  persona: "You are a hair health and nutrition specialist who helps users find science-backed nutraceutical supplements for reducing hair fall, improving hair growth, and increasing hair thickness. You focus on biotin, keratin, zinc, iron, collagen, and amino acids that support hair health from within. You consider dietary preferences, age, gender, and specific hair concerns to provide personalized recommendations."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Consumer hair health concerns and wellness goals
  # ============================================================================
  problems:
    - id: hair_thinning
      name: "hair_thinning"
      display_name: "Hair Thinning"
      synonyms:
        - "thin hair"
        - "fine hair"
        - "lack of volume"
        - "hair density loss"
        - "sparse hair"
        - "thinning hair"
      severity_levels: [mild, moderate, severe]
      description: "Progressive reduction in hair density and thickness"

    - id: hair_fall
      name: "hair_fall"
      display_name: "Excessive Hair Fall"
      synonyms:
        - "hair loss"
        - "hair shedding"
        - "falling hair"
        - "excessive shedding"
        - "hair dropping"
        - "losing hair"
      severity_levels: [mild, moderate, severe]
      description: "Abnormal amount of daily hair shedding"

    - id: hair_breakage
      name: "hair_breakage"
      display_name: "Hair Breakage"
      synonyms:
        - "brittle hair"
        - "breaking hair"
        - "damaged hair"
        - "fragile hair"
        - "weak hair strands"
        - "split ends"
      severity_levels: [mild, moderate, severe]
      description: "Hair strands breaking before reaching full length"

    - id: slow_growth
      name: "slow_growth"
      display_name: "Slow Hair Growth"
      synonyms:
        - "stunted growth"
        - "hair won't grow"
        - "growth plateau"
        - "slow growing hair"
        - "hair not growing"
      severity_levels: [mild, moderate, severe]
      description: "Hair growing slower than normal rate (< 0.5 inch/month)"

    - id: lack_of_thickness
      name: "lack_of_thickness"
      display_name: "Lack of Hair Thickness"
      synonyms:
        - "thin strands"
        - "fine texture"
        - "no volume"
        - "flat hair"
        - "limp hair"
      severity_levels: [mild, moderate, severe]
      description: "Individual hair strands lacking diameter and body"

    - id: nutrient_deficiency
      name: "nutrient_deficiency"
      display_name: "Nutritional Deficiencies Affecting Hair"
      synonyms:
        - "vitamin deficiency"
        - "mineral deficiency"
        - "iron deficiency"
        - "biotin deficiency"
        - "protein deficiency"
        - "nutritional gaps"
      severity_levels: [mild, moderate, severe]
      description: "Lack of essential nutrients required for healthy hair growth"

    - id: premature_greying
      name: "premature_greying"
      display_name: "Premature Greying"
      synonyms:
        - "early grey hair"
        - "premature white hair"
        - "young grey hair"
        - "grey before 30"
      severity_levels: [mild, moderate, severe]
      description: "Grey hair appearing before age 30-35"

    - id: dull_hair
      name: "dull_hair"
      display_name: "Dull & Lifeless Hair"
      synonyms:
        - "no shine"
        - "lackluster hair"
        - "matte hair"
        - "dry appearance"
        - "faded hair"
      severity_levels: [mild, moderate, severe]
      description: "Hair lacking natural shine and vitality"

  # ============================================================================
  # ATTRIBUTES - User characteristics that influence recommendations
  # ============================================================================
  attributes:
    # Age Group - Critical for hair loss severity
    - id: age_group_18_25
      category: age_group
      value: "18-25"
      data_type: single_choice
      elicitation_priority: 2
      is_global: true

    - id: age_group_26_35
      category: age_group
      value: "26-35"
      data_type: single_choice
      elicitation_priority: 2
      is_global: true

    - id: age_group_36_45
      category: age_group
      value: "36-45"
      data_type: single_choice
      elicitation_priority: 2
      is_global: true

    - id: age_group_46_plus
      category: age_group
      value: "46+"
      data_type: single_choice
      elicitation_priority: 2
      is_global: true

    # Dietary Preference - Critical for ingredient selection
    - id: diet_vegetarian
