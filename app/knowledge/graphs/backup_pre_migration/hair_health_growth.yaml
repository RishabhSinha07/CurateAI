      strength_levels: ["250mg", "500mg"]

    - id: amla
      name: "amla"
      display_name: "Amla (Indian Gooseberry)"
      function: "vitamin_c_source_hair_health"
      category: "beauty"
      strength_levels: ["250mg", "500mg", "1000mg"]

    - id: horsetail_extract
      name: "horsetail_extract"
      display_name: "Horsetail Extract"
      function: "silica_source_hair_strength"
      category: "beauty"
