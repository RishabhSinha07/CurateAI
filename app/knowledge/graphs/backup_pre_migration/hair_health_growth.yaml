    # AMINO ACIDS - Building blocks for hair protein
    - id: l_cysteine
      name: "l_cysteine"
      display_name: "L-Cysteine"
      function: "keratin_building_block"
      category: "protein"
      strength_levels: ["500mg", "1000mg"]

    - id: l_methionine
      name: "l_methionine"
      display_name: "L-Methionine"
      function: "sulfur_amino_acid_hair_growth"
      category: "protein"
