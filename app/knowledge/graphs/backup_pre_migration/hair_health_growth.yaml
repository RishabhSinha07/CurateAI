      data_type: single_choice
      elicitation_priority: 6
      is_global: false

    - id: lifestyle_low_stress
      category: lifestyle
      value: low_stress
      data_type: single_choice
      elicitation_priority: 6
      is_global: false

    # ============================================================================
    # SAFETY CONSTRAINTS - Global hard constraints (ALWAYS ask these first)
    # ============================================================================

    # Medical Constraints
    - id: medical_constraint_pregnancy
      category: medical_constraints
      value: "no"
      data_type: boolean
      elicitation_priority: 1
      is_global: true

    - id: medical_constraint_breastfeeding
      category: medical_constraints
      value: "no"
