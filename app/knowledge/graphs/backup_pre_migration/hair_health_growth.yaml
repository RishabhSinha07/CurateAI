    # Scalp Condition
    - id: scalp_dry
      category: scalp_condition
      value: dry
      data_type: single_choice
      elicitation_priority: 4
      is_global: false

    - id: scalp_oily
      category: scalp_condition
      value: oily
      data_type: single_choice
      elicitation_priority: 4
      is_global: false

    - id: scalp_normal
      category: scalp_condition
      value: normal
      data_type: single_choice
      elicitation_priority: 4
      is_global: false

    - id: scalp_sensitive
      category: scalp_condition
      value: sensitive
      data_type: single_choice
      elicitation_priority: 4
      is_global: false

    # Lifestyle Factors
    - id: lifestyle_high_stress
      category: lifestyle
      value: high_stress
      data_type: single_choice
      elicitation_priority: 6
      is_global: false

    - id: lifestyle_moderate_stress
      category: lifestyle
