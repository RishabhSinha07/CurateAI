      display_name: "Vitamin C (Ascorbic Acid)"
      function: "collagen_synthesis_iron_absorption"
      category: "vitamins"
      strength_levels: ["500mg", "1000mg", "2000mg"]

    # VITAMIN D - Hair follicle cycling
    - id: vitamin_d3
      name: "vitamin_d3"
