    # OMEGA-3 FATTY ACIDS
    - id: omega_3
      name: "omega_3"
      display_name: "Omega-3 Fatty Acids"
      function: "scalp_health_inflammation"
      category: "beauty"
      strength_levels: ["500mg", "1000mg", "2000mg"]

  # ============================================================================
  # CONSTRAINTS - User limitations that exclude certain products
  # ============================================================================
  constraints:
    - id: pregnancy
      type: "medical"
      value: "true"
      severity: "hard"

    - id: breastfeeding
      type: "medical"
      value: "true"
      severity: "hard"

    - id: thyroid_condition
      type: "medical"
      value: "thyroid"
      severity: "hard"

    - id: pcos_condition
      type: "medical"
      value: "pcos"
      severity: "soft"

    - id: allergy_soy
      type: "allergy"
      value: "soy"
      severity: "hard"

    - id: allergy_gluten
      type: "allergy"
      value: "gluten"
      severity: "hard"

    - id: diet_vegan_constraint
      type: "dietary"
      value: "vegan"
      severity: "hard"

    - id: diet_vegetarian_constraint
      type: "dietary"
      value: "vegetarian"
      severity: "hard"

  # ============================================================================
  # QUESTIONS - Templates for eliciting information
  # ============================================================================
  questions:
    - id: q_primary_hair_concern
      text: "What is your primary hair concern?"
      response_type: "single_choice"
      options:
        - "Excessive hair fall/shedding"
        - "Hair thinning/lack of density"
        - "Hair breakage/brittleness"
        - "Slow hair growth"
        - "Lack of thickness/volume"
        - "Dull, lifeless hair"
        - "Premature greying"
        - "Overall hair health"

    - id: q_age_group
      text: "What is your age group?"
      response_type: "single_choice"
      options:
        - "18-25"
        - "26-35"
        - "36-45"
        - "46+"

    - id: q_gender
      text: "What is your gender?"
      response_type: "single_choice"
      options:
        - "Female"
        - "Male"
        - "Prefer not to say"

    - id: q_diet
      text: "What is your dietary preference?"
      response_type: "single_choice"
      options:
        - "Vegetarian"
        - "Vegan"
        - "Pescatarian"
        - "Non-vegetarian"

    - id: q_hair_type
      text: "What is your hair type?"
      response_type: "single_choice"
      options:
        - "Straight"
        - "Wavy"
        - "Curly"
        - "Coily/Kinky"

    - id: q_scalp_condition
      text: "How would you describe your scalp condition?"
      response_type: "single_choice"
      options:
        - "Dry/Flaky"
        - "Oily/Greasy"
        - "Normal/Balanced"
        - "Sensitive/Irritated"

    - id: q_stress_level
      text: "How would you describe your stress levels?"
      response_type: "single_choice"
      options:
        - "High stress/demanding lifestyle"
        - "Moderate stress"
        - "Low stress/relaxed"

    # Safety Constraint Questions (asked first for all users)
    - id: q_medical_constraints
      text: "Do any of these medical conditions apply to you?"
      response_type: "multi_choice"
      options:
        - "Pregnancy"
        - "Breastfeeding"
        - "Thyroid condition"
        - "PCOS"
        - "None of the above"
      validation_rules:
        allow_none: true

    - id: q_allergies
      text: "Do you have any of these allergies?"
      response_type: "multi_choice"
      options:
        - "Soy allergy"
        - "Gluten allergy"
        - "No allergies"
      validation_rules:
        allow_none: true

# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # --------------------------------------------------------------------------
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  # Defines which attributes are needed to recommend solutions for a problem
  # --------------------------------------------------------------------------

  # Hair Thinning requires knowing age and gender
  - source: hair_thinning
    target: age_group_26_35
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age determines hair loss pattern and appropriate intervention"

  - source: hair_thinning
    target: gender_female
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Gender affects hair loss patterns and hormonal factors"

  # Hair Fall requires knowing diet and stress
  - source: hair_fall
    target: diet_vegetarian
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Dietary preference determines nutrient availability (iron, protein)"

  - source: hair_fall
    target: lifestyle_high_stress
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Stress is a major contributor to telogen effluvium"

  # Hair Breakage
  - source: hair_breakage
    target: hair_type_curly
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Hair type affects breakage patterns and protein needs"

  - source: hair_breakage
    target: diet_vegan
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Plant-based diets may need additional protein and amino acids"

  # Slow Growth
  - source: slow_growth
    target: age_group_18_25
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age affects growth rate and nutritional needs"

  # Nutrient Deficiency
  - source: nutrient_deficiency
    target: diet_vegan
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Plant-based diets require specific nutrient supplementation"

  - source: nutrient_deficiency
    target: gender_female
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Women have higher iron needs due to menstruation"

  # --------------------------------------------------------------------------
  # ATTRIBUTE → ELICITS_QUESTION → QUESTION
  # Maps attributes to questions that elicit them
  # --------------------------------------------------------------------------

  - source: age_group_18_25
    target: q_age_group
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  - source: gender_female
    target: q_gender
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  - source: diet_vegan
    target: q_diet
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  - source: hair_type_straight
    target: q_hair_type
    relation: ELICITS_QUESTION
    properties:
      condition: "if_breakage_concern"
      timing: "immediate"

  - source: scalp_dry
    target: q_scalp_condition
    relation: ELICITS_QUESTION
    properties:
      condition: "if_not_known"
      timing: "immediate"

  - source: lifestyle_high_stress
    target: q_stress_level
    relation: ELICITS_QUESTION
    properties:
      condition: "if_hair_fall_concern"
      timing: "immediate"

  # Global Safety Constraint Questions (asked FIRST for everyone)
  - source: medical_constraint_pregnancy
    target: q_medical_constraints
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"
      is_safety_critical: true

  - source: medical_constraint_breastfeeding
    target: q_medical_constraints
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"
      is_safety_critical: true

  - source: medical_constraint_thyroid
    target: q_medical_constraints
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"
      is_safety_critical: true

  - source: allergy_constraint_soy
    target: q_allergies
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"
      is_safety_critical: true

  # --------------------------------------------------------------------------
  # INGREDIENT → TREATS → PROBLEM
  # Defines which ingredients are effective for which problems
  # --------------------------------------------------------------------------

  # BIOTIN for Hair Growth and Thickness
  - source: biotin
    target: hair_thinning
    relation: TREATS
    properties:
      mechanism: "Essential cofactor for keratin synthesis and hair follicle health"
      efficacy: 0.85
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  - source: biotin
    target: hair_breakage
    relation: TREATS
    properties:
      mechanism: "Strengthens hair structure through improved keratin production"
      efficacy: 0.80
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  - source: biotin
    target: slow_growth
    relation: TREATS
    properties:
      mechanism: "Supports cellular energy metabolism for active hair growth"
      efficacy: 0.75
      onset_time: "12-16 weeks"
      evidence_level: "clinical_trial"

  # KERATIN for Hair Structure
  - source: keratin_peptides
    target: hair_breakage
    relation: TREATS
    properties:
      mechanism: "Provides bioavailable keratin building blocks to repair damaged hair"
      efficacy: 0.90
      onset_time: "6-10 weeks"
      evidence_level: "clinical_trial"

  - source: keratin_peptides
    target: lack_of_thickness
    relation: TREATS
    properties:
      mechanism: "Increases hair shaft diameter and strength"
      efficacy: 0.85
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  - source: hydrolyzed_keratin
    target: hair_breakage
