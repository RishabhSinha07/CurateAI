    # Allergy Constraints
    - id: allergy_constraint_soy
      category: allergies
      value: "no"
      data_type: boolean
      elicitation_priority: 1
      is_global: true

    - id: allergy_constraint_gluten
      category: allergies
      value: "no"
      data_type: boolean
      elicitation_priority: 1
      is_global: true

  # ============================================================================
  # INGREDIENTS - Key actives for hair health & growth
  # ============================================================================
  ingredients:
    # BIOTIN - Vitamin B7 for keratin production
    - id: biotin
      name: "biotin"
      display_name: "Biotin (Vitamin B7)"
      function: "keratin_production_hair_growth"
      category: "vitamins"
      strength_levels: ["2500mcg", "5000mcg", "10000mcg"]

    # KERATIN - Structural protein
    - id: keratin_peptides
      name: "keratin_peptides"
      display_name: "Keratin Peptides"
      function: "hair_structure_strength"
      category: "protein"
      strength_levels: ["500mg", "1000mg", "1500mg"]

    - id: hydrolyzed_keratin
      name: "hydrolyzed_keratin"
      display_name: "Hydrolyzed Keratin"
      function: "hair_repair_fortification"
      category: "protein"
      strength_levels: ["500mg", "1000mg"]

    # COLLAGEN - Types I & III for hair structure
    - id: collagen_type_1_3_marine
