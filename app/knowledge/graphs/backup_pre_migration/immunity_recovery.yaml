        - "Vegan"
        - "Pescatarian"
        - "Non-vegetarian"

    - id: q_stress_level
      text: "How would you describe your stress levels?"
      response_type: "single_choice"
      options:
        - "High stress/demanding lifestyle"
        - "Moderate stress"
        - "Low stress/relaxed"

    - id: q_sleep_quality
      text: "How would you describe your sleep quality?"
      response_type: "single_choice"
      options:
        - "Poor (less than 6 hours or restless)"
        - "Adequate (6-7 hours)"
        - "Excellent (7-8+ hours, restful)"

    - id: q_exercise_level
      text: "How active is your lifestyle?"
      response_type: "single_choice"
      options:
        - "Sedentary (little to no exercise)"
        - "Moderately active (2-3 times/week)"
        - "Very active (4+ times/week, intense)"

    - id: q_sun_exposure
      text: "How much daily sun exposure do you get?"
      response_type: "single_choice"
      options:
        - "Minimal (mostly indoors)"
        - "Moderate (1-2 hours outdoors)"
        - "High (3+ hours outdoors)"

    - id: q_recent_illness
      text: "Have you been ill in the last month?"
      response_type: "single_choice"
      options:
        - "Yes, recovering now"
        - "Yes, recently recovered"
        - "No"

    - id: q_season
      text: "What season is it currently?"
      response_type: "single_choice"
      options:
        - "Winter (cold, flu season)"
        - "Monsoon (rainy, infection season)"
        - "Summer"
        - "Other/Not relevant"

    # Safety Constraint Questions (asked first for all users)
    - id: q_medical_constraints
      text: "Do any of these medical conditions apply to you?"
      response_type: "multi_choice"
      options:
        - "Pregnancy"
        - "Breastfeeding"
        - "Autoimmune condition"
        - "Diabetes"
        - "Taking blood thinners"
        - "None of the above"
      validation_rules:
        allow_none: true

    - id: q_allergies
      text: "Do you have any of these allergies?"
      response_type: "multi_choice"
      options:
        - "Citrus allergy"
        - "Mushroom allergy"
        - "No allergies"
      validation_rules:
        allow_none: true

# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # --------------------------------------------------------------------------
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  # Defines which attributes are needed to recommend solutions for a problem
  # --------------------------------------------------------------------------

  # Frequent Illness requires knowing lifestyle factors
  - source: frequent_illness
    target: lifestyle_high_stress
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Chronic stress significantly weakens immune function"

  - source: frequent_illness
    target: sleep_poor
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Poor sleep impairs immune cell function and antibody production"

  - source: frequent_illness
    target: sun_exposure_minimal
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Vitamin D deficiency from low sun exposure increases infection risk"

  # Low Resistance requires knowing age and diet
  - source: low_resistance
    target: age_group_46_plus
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Immune function naturally declines with age"

  - source: low_resistance
    target: diet_vegan
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
