  # ============================================================================
  # QUESTIONS - Templates for eliciting information
  # ============================================================================
  questions:
    - id: q_primary_immune_concern
      text: "What is your primary immunity concern?"
      response_type: "single_choice"
      options:
        - "Getting sick frequently"
        - "Low immune resistance"
        - "Slow recovery from illness"
        - "Seasonal illness susceptibility"
        - "Post-illness fatigue"
        - "Respiratory infections"
        - "Overall immune support"

    - id: q_age_group
      text: "What is your age group?"
      response_type: "single_choice"
      options:
        - "18-25"
        - "26-35"
        - "36-45"
        - "46+"

    - id: q_gender
      text: "What is your gender?"
      response_type: "single_choice"
      options:
        - "Female"
        - "Male"
        - "Prefer not to say"

    - id: q_diet
      text: "What is your dietary preference?"
      response_type: "single_choice"
      options:
