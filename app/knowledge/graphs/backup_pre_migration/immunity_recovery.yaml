# Immunity & Recovery Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on immune system support, illness prevention, and faster recovery.
#
# UPDATING THIS GRAPH:
# 1. Add new nodes under the appropriate section (problems, attributes, etc.)
# 2. Ensure all IDs are unique and use snake_case
# 3. Add edges to connect new nodes to existing ones
# 4. Run validation: python -m app.knowledge.validate immunity_recovery
# 5. Reload graph in development: reload_graph('immunity_recovery')

metadata:
  domain: immunity_recovery
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for immunity & recovery nutraceutical recommendations"
  display_name: "Immunity & Recovery"
  persona: "You are an immune health and wellness specialist who helps users find science-backed nutraceutical supplements for strengthening immunity, preventing illness, and supporting faster recovery. You focus on vitamins, minerals, antioxidants, and botanical extracts that support immune function. You consider lifestyle factors, seasonal patterns, and health history to provide personalized recommendations."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Consumer immune health concerns and wellness goals
  # ============================================================================
  problems:
    - id: frequent_illness
      name: "frequent_illness"
      display_name: "Frequent Illness & Infections"
      synonyms:
        - "getting sick often"
        - "frequent colds"
        - "frequent flu"
        - "always sick"
        - "catch everything"
        - "weak immunity"
        - "frequent infections"
      severity_levels: [mild, moderate, severe]
      description: "Recurring infections, colds, or flu more than 3-4 times per year"

    - id: low_resistance
      name: "low_resistance"
      display_name: "Low Immune Resistance"
      synonyms:
        - "weak immune system"
        - "poor immunity"
        - "low immunity"
        - "susceptible to illness"
        - "easily infected"
        - "compromised immunity"
      severity_levels: [mild, moderate, severe]
      description: "Reduced ability to fight off infections and pathogens"

    - id: slow_recovery
      name: "slow_recovery"
      display_name: "Slow Recovery from Illness"
      synonyms:
        - "slow healing"
        - "prolonged illness"
        - "long recovery time"
        - "takes long to recover"
        - "illness lasts long"
      severity_levels: [mild, moderate, severe]
      description: "Extended time to recover from infections or illness"

    - id: seasonal_susceptibility
      name: "seasonal_susceptibility"
      display_name: "Seasonal Illness Susceptibility"
      synonyms:
        - "winter illness"
        - "seasonal flu"
        - "cold season sickness"
        - "weather change illness"
        - "monsoon infections"
      severity_levels: [mild, moderate, severe]
      description: "Increased susceptibility to illness during specific seasons"

    - id: post_illness_weakness
      name: "post_illness_weakness"
      display_name: "Post-Illness Fatigue & Weakness"
      synonyms:
        - "recovery fatigue"
        - "weakness after illness"
        - "post-infection fatigue"
        - "tired after being sick"
        - "no energy after illness"
      severity_levels: [mild, moderate, severe]
      description: "Persistent fatigue and weakness after recovering from illness"

    - id: chronic_inflammation
      name: "chronic_inflammation"
      display_name: "Chronic Inflammation"
      synonyms:
        - "ongoing inflammation"
        - "persistent inflammation"
        - "systemic inflammation"
        - "inflammatory response"
      severity_levels: [mild, moderate, severe]
      description: "Long-term inflammatory state affecting immune function"

    - id: oxidative_stress
      name: "oxidative_stress"
      display_name: "Oxidative Stress & Free Radical Damage"
      synonyms:
        - "free radical damage"
        - "oxidation"
        - "cellular stress"
        - "oxidative damage"
      severity_levels: [mild, moderate, severe]
      description: "Excess free radicals overwhelming antioxidant defenses"

    - id: respiratory_infections
      name: "respiratory_infections"
      display_name: "Frequent Respiratory Infections"
      synonyms:
        - "chest infections"
        - "respiratory illness"
        - "lung infections"
        - "throat infections"
        - "sinus infections"
        - "bronchitis"
      severity_levels: [mild, moderate, severe]
      description: "Recurring infections of the respiratory tract"

    - id: low_energy_immunity
      name: "low_energy_immunity"
      display_name: "Low Energy & Immune Fatigue"
      synonyms:
        - "immune exhaustion"
        - "tired immune system"
        - "immune fatigue"
        - "no energy to fight illness"
      severity_levels: [mild, moderate, severe]
      description: "Depleted energy affecting immune system function"

