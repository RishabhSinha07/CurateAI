# =============================================================================
# CONSTRAINT NODES - Safety considerations
# =============================================================================
constraints:
  - id: blood_thinner_interaction_aging
    label: "May Interact with Blood Thinners"
    type: "interaction"
    severity: "high"
    applies_to: ["resveratrol", "curcumin_aging", "omega3_aging", "vitamin_e_aging"]

  - id: chemotherapy_interaction
    label: "May Interfere with Chemotherapy"
    type: "interaction"
    severity: "critical"
    applies_to: ["nac_aging", "glutathione_aging", "vitamin_c_aging"]

  - id: autoimmune_caution
    label: "Use Caution with Autoimmune Conditions"
    type: "contraindication"
    severity: "moderate"
    applies_to: ["ashwagandha_aging", "rhodiola"]

