# Healthy Aging & Longevity Knowledge Graph
# Domain: healthy_aging_longevity
# Focus: Cellular health, anti-aging, longevity, inflammation, vitality

domain:
  slug: healthy_aging_longevity
  name: "Healthy Aging & Longevity"
  description: "Support for graceful aging, cellular health, longevity, and vitality"

# =============================================================================
# PROBLEM NODES - User health concerns
# =============================================================================
problems:
  - id: chronic_inflammation_aging
    label: "Chronic Inflammation (Inflammaging)"
    description: "Low-grade systemic inflammation that accelerates aging"
    symptoms: ["joint pain", "fatigue", "brain fog", "metabolic issues", "increased disease risk"]
    severity: "moderate_to_severe"

  - id: cellular_aging
    label: "Cellular Aging & Senescence"
    description: "Accumulation of senescent cells and cellular damage"
    symptoms: ["decreased energy", "slower recovery", "reduced vitality", "age-related decline"]
    severity: "moderate_to_severe"

  - id: oxidative_stress_aging
    label: "Oxidative Stress & Free Radical Damage"
    description: "Excess free radicals damaging cells, DNA, and proteins"
    symptoms: ["premature aging", "wrinkles", "fatigue", "cognitive decline"]
    severity: "moderate"

  - id: mitochondrial_dysfunction
    label: "Mitochondrial Decline"
    description: "Reduced mitochondrial function and energy production with age"
    symptoms: ["fatigue", "muscle weakness", "brain fog", "metabolic slowdown"]
    severity: "moderate_to_severe"

  - id: cognitive_decline_aging
    label: "Age-Related Cognitive Decline"
    description: "Memory loss, reduced mental clarity, slower processing speed"
    symptoms: ["memory problems", "brain fog", "slow thinking", "reduced focus"]
    severity: "moderate_to_severe"

  - id: skin_aging
    label: "Skin Aging (Wrinkles, Loss of Elasticity)"
    description: "Visible signs of aging including wrinkles, sagging, age spots"
    symptoms: ["wrinkles", "fine lines", "sagging skin", "age spots", "dryness"]
    severity: "mild_to_moderate"

  - id: sarcopenia
    label: "Sarcopenia (Age-Related Muscle Loss)"
    description: "Progressive loss of muscle mass and strength with aging"
    symptoms: ["muscle loss", "weakness", "reduced mobility", "frailty"]
    severity: "moderate_to_severe"

  - id: metabolic_decline_aging
    label: "Metabolic Decline with Age"
    description: "Slower metabolism, insulin resistance, weight gain"
    symptoms: ["weight gain", "metabolic slowdown", "insulin resistance", "fatigue"]
    severity: "moderate"

  - id: telomere_shortening
    label: "Telomere Shortening"
    description: "Erosion of protective chromosome caps linked to cellular aging"
    symptoms: ["cellular aging", "reduced regeneration", "increased disease risk"]
    severity: "severe"

# =============================================================================
# ATTRIBUTE NODES - User characteristics that inform recommendations
# =============================================================================
attributes:
  - id: age_longevity
    label: "Age"
    type: "categorical"
    values: ["under_40", "40-50", "50-60", "60-70", "70+"]

  - id: primary_aging_concern
    label: "Primary Aging Concern"
    type: "categorical"
    values: ["energy_vitality", "cognitive_health", "skin_appearance", "joint_mobility", "overall_longevity"]

  - id: health_optimization_level
    label: "Health Optimization Level"
    type: "categorical"
    values: ["prevention", "maintenance", "reversal", "peak_performance"]

  - id: chronic_conditions_aging
    label: "Chronic Health Conditions"
    type: "multi_select"
    values: ["diabetes", "cardiovascular", "arthritis", "autoimmune", "none"]

# =============================================================================
# INGREDIENT NODES - Supplements and nutrients
# =============================================================================
ingredients:
