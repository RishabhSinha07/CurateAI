  - id: nmn
    label: "NMN (Nicotinamide Mononucleotide)"
    category: "nad_precursor"
    forms: ["powder", "capsule"]
    typical_dose: "250-500mg daily"

  - id: nr
    label: "NR (Nicotinamide Riboside)"
    category: "nad_precursor"
    forms: ["capsule"]
    typical_dose: "300-500mg daily"

  - id: nad
