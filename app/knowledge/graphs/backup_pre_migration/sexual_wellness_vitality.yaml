# Sexual Wellness & Vitality Knowledge Graph
# Domain: sexual_wellness_vitality
# Focus: Libido, performance, fertility, sexual energy, and vitality

domain:
  slug: sexual_wellness_vitality
  name: "Sexual Wellness & Vitality"
  description: "Support for libido, sexual performance, fertility, and overall vitality"

# =============================================================================
# PROBLEM NODES - User health concerns
# =============================================================================
problems:
  - id: low_libido_sexual
    label: "Low Sex Drive"
    description: "Reduced sexual desire and interest in sexual activity"
    symptoms: ["decreased desire", "low arousal", "lack of interest", "relationship strain"]
    severity: "moderate"

  - id: erectile_dysfunction
    label: "Erectile Dysfunction (ED)"
    description: "Difficulty achieving or maintaining erections"
    symptoms: ["weak erections", "inability to maintain", "reduced hardness", "performance anxiety"]
    severity: "moderate_to_severe"

  - id: low_sexual_stamina
    label: "Low Sexual Stamina"
    description: "Premature fatigue and reduced endurance during intimacy"
    symptoms: ["quick fatigue", "low endurance", "premature ejaculation", "reduced staying power"]
    severity: "moderate"

  - id: male_fertility_issues
    label: "Male Fertility Issues"
    description: "Low sperm count, poor motility, or abnormal morphology"
    symptoms: ["low sperm count", "poor motility", "abnormal morphology", "difficulty conceiving"]
    severity: "moderate_to_severe"

  - id: female_fertility_sexual
    label: "Female Fertility Challenges"
    description: "Ovulation issues, hormonal imbalances affecting conception"
    symptoms: ["irregular ovulation", "luteal phase defect", "poor egg quality", "difficulty conceiving"]
    severity: "moderate_to_severe"

  - id: low_testosterone
    label: "Low Testosterone (Hypogonadism)"
    description: "Reduced testosterone levels affecting vitality and sexual function"
    symptoms: ["low energy", "muscle loss", "fat gain", "reduced libido", "mood changes"]
    severity: "moderate_to_severe"

  - id: sexual_performance_anxiety
    label: "Sexual Performance Anxiety"
    description: "Psychological stress affecting sexual performance"
    symptoms: ["stress before intimacy", "fear of failure", "mental blocks", "tension"]
    severity: "moderate"

  - id: vaginal_dryness
    label: "Vaginal Dryness & Discomfort"
    description: "Lack of natural lubrication causing discomfort during intimacy"
    symptoms: ["dryness", "pain during sex", "discomfort", "reduced arousal"]
    severity: "moderate"

  - id: poor_circulation_sexual
    label: "Poor Blood Circulation (Sexual)"
    description: "Reduced blood flow affecting arousal and performance"
    symptoms: ["cold extremities", "weak erections", "reduced arousal", "numbness"]
    severity: "moderate"

# =============================================================================
# ATTRIBUTE NODES - User characteristics that inform recommendations
# =============================================================================
attributes:
  - id: biological_sex
    label: "Biological Sex"
    type: "categorical"
    values: ["male", "female", "prefer_not_to_say"]

  - id: age_group_sexual
    label: "Age Group"
    type: "categorical"
    values: ["18-30", "31-45", "46-60", "60+"]

  - id: trying_to_conceive_sexual
    label: "Trying to Conceive"
    type: "boolean"

  - id: current_medications
    label: "Taking Medications"
    type: "multi_select"
    values: ["blood_pressure_meds", "antidepressants", "diabetes_meds", "none"]

  - id: lifestyle_factors
    label: "Lifestyle Factors"
    type: "multi_select"
    values: ["high_stress", "poor_sleep", "sedentary", "smoker", "excessive_alcohol"]

