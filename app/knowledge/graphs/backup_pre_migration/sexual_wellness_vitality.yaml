# =============================================================================
# CONSTRAINT NODES - Safety considerations
# =============================================================================
constraints:
  - id: blood_pressure_medication_interaction
    label: "May Interact with Blood Pressure Medications"
    type: "interaction"
    severity: "high"
    applies_to: ["l_arginine", "l_citrulline", "beetroot_extract", "korean_red_ginseng"]

  - id: pregnancy_unsafe_sexual
    label: "Not Safe During Pregnancy"
    type: "contraindication"
    severity: "critical"
    applies_to: ["tribulus_terrestris", "fenugreek", "damiana", "horny_goat_weed"]

  - id: hormone_sensitive_cancer_risk
    label: "Caution with Hormone-Sensitive Conditions"
    type: "contraindication"
    severity: "high"
    applies_to: ["dhea", "tribulus_terrestris", "fenugreek"]

  - id: antidepressant_interaction
    label: "May Interact with Antidepressants (SSRIs)"
    type: "interaction"
    severity: "moderate"
    applies_to: ["saffron_sexual", "ginseng"]

