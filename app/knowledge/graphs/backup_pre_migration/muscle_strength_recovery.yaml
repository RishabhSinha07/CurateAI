# Muscle, Strength & Recovery Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on building muscle mass, increasing strength, and optimizing recovery from exercise.
#
# UPDATING THIS GRAPH:
# 1. Add new nodes under the appropriate section (problems, attributes, etc.)
# 2. Ensure all IDs are unique and use snake_case
# 3. Add edges to connect new nodes to existing ones
# 4. Run validation: python -m app.knowledge.validate muscle_strength_recovery
# 5. Reload graph in development: reload_graph('muscle_strength_recovery')

metadata:
  domain: muscle_strength_recovery
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for muscle building, strength gains, and recovery optimization"
  display_name: "Muscle, Strength & Recovery"
  persona: "You are a muscle building and recovery specialist who helps users optimize their nutrition for muscle growth, strength gains, and post-workout recovery. You focus on protein intake, amino acid timing, muscle repair nutrients, and evidence-based supplementation. You consider training intensity, recovery needs, dietary patterns, and individual goals to provide personalized recommendations."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Muscle building and recovery challenges
  # ============================================================================
  problems:
    - id: muscle_soreness
      name: "muscle_soreness"
      display_name: "Muscle Soreness & DOMS"
      synonyms:
        - "sore muscles"
        - "DOMS"
        - "delayed onset muscle soreness"
        - "post-workout soreness"
        - "muscle pain after workout"
        - "aching muscles"
      severity_levels: [mild, moderate, severe]
      description: "Delayed onset muscle soreness (DOMS) occurring 24-72 hours after exercise"

    - id: slow_muscle_recovery
      name: "slow_muscle_recovery"
      display_name: "Slow Muscle Recovery"
      synonyms:
        - "prolonged recovery"
        - "can't recover between workouts"
        - "always sore"
        - "delayed recovery"
        - "extended soreness"
      severity_levels: [mild, moderate, severe]
      description: "Extended time needed for muscles to recover between training sessions"

    - id: difficulty_building_muscle
      name: "difficulty_building_muscle"
      display_name: "Difficulty Building Muscle Mass"
      synonyms:
        - "can't gain muscle"
        - "no muscle growth"
        - "hard gainer"
        - "not building muscle"
        - "no gains"
        - "plateau"
      severity_levels: [mild, moderate, severe]
      description: "Inability to increase muscle mass despite consistent training"

    - id: strength_plateau
      name: "strength_plateau"
      display_name: "Strength Plateau"
      synonyms:
        - "not getting stronger"
        - "stuck at same weight"
        - "no strength gains"
        - "hit a plateau"
        - "can't lift heavier"
      severity_levels: [mild, moderate, severe]
      description: "Lack of progress in strength despite consistent training"

    - id: inadequate_protein
      name: "inadequate_protein"
      display_name: "Inadequate Protein Intake"
      synonyms:
        - "not enough protein"
        - "protein deficiency"
        - "low protein diet"
        - "need more protein"
        - "protein shortage"
      severity_levels: [mild, moderate, severe]
      description: "Insufficient protein intake to support muscle growth and recovery"

    - id: muscle_breakdown
      name: "muscle_breakdown"
      display_name: "Excessive Muscle Breakdown"
      synonyms:
        - "muscle loss"
        - "losing muscle"
        - "muscle catabolism"
        - "muscle wasting"
        - "losing gains"
      severity_levels: [mild, moderate, severe]
      description: "Loss of muscle tissue due to inadequate nutrition or excessive training"

    - id: joint_pain_training
      name: "joint_pain_training"
      display_name: "Joint Pain During Training"
      synonyms:
        - "joint discomfort"
        - "achy joints"
        - "joint stiffness"
        - "joint soreness"
        - "painful joints"
      severity_levels: [mild, moderate, severe]
      description: "Pain or discomfort in joints during or after resistance training"

    - id: poor_exercise_endurance
      name: "poor_exercise_endurance"
      display_name: "Poor Exercise Endurance"
      synonyms:
        - "can't complete sets"
        - "run out of steam"
        - "muscle fatigue too quickly"
        - "low workout capacity"
        - "poor stamina in gym"
      severity_levels: [mild, moderate, severe]
      description: "Inability to sustain intensity or complete training volume"

    - id: slow_strength_gains
      name: "slow_strength_gains"
      display_name: "Slow Strength Progression"
      synonyms:
        - "slow progress"
        - "strength gains too slow"
        - "not progressing fast enough"
        - "minimal strength improvement"
      severity_levels: [mild, moderate, severe]
      description: "Slower than expected increases in strength over time"

  # ============================================================================
  # ATTRIBUTES - User context for personalization
  # ============================================================================
  attributes:
    # Training-related attributes
    - id: training_goal
      name: "training_goal"
      display_name: "Training Goal"
      type: categorical
      values:
        - muscle_gain
        - strength_gain
        - athletic_performance
        - body_recomposition
        - maintenance
      required: true
      description: "Primary goal for resistance training"

    - id: training_experience
      name: "training_experience"
      display_name: "Training Experience"
      type: categorical
      values:
        - beginner
        - intermediate
        - advanced
        - professional
      required: true
      description: "Level of resistance training experience"

    - id: training_frequency
      name: "training_frequency"
      display_name: "Training Frequency"
      type: categorical
      values:
        - 1_2_days
        - 3_4_days
        - 5_6_days
        - daily
      required: true
      description: "Number of training sessions per week"

    - id: training_type
      name: "training_type"
      display_name: "Primary Training Type"
      type: categorical
      values:
        - strength_training
        - bodybuilding
        - powerlifting
        - crossfit
        - functional_fitness
        - sports_specific
      required: false
      description: "Type of resistance training performed"

    - id: workout_timing
      name: "workout_timing"
      display_name: "Workout Timing"
      type: categorical
      values:
        - morning
        - afternoon
        - evening
        - variable
      required: false
      description: "Typical time of day for training"

    # Nutrition attributes
    - id: current_protein_intake
      name: "current_protein_intake"
      display_name: "Current Daily Protein Intake"
      type: categorical
      values:
        - very_low  # <0.5g/kg
        - low  # 0.5-1.0g/kg
        - moderate  # 1.0-1.6g/kg
        - adequate  # 1.6-2.2g/kg
        - high  # >2.2g/kg
        - unknown
      required: true
      description: "Estimated daily protein consumption"

    - id: dietary_preference
      name: "dietary_preference"
      display_name: "Dietary Preference"
      type: categorical
      values:
        - vegetarian
        - vegan
        - pescatarian
        - non_veg
        - no_preference
      required: true
      description: "Dietary restrictions or preferences"

    - id: meal_frequency
      name: "meal_frequency"
      display_name: "Meal Frequency"
      type: categorical
      values:
        - 1_2_meals
        - 3_meals
        - 4_5_meals
        - 6_plus_meals
      required: false
      description: "Number of meals/snacks consumed daily"

    # Recovery attributes
    - id: sleep_quality
      name: "sleep_quality"
      display_name: "Sleep Quality"
      type: categorical
      values:
        - poor
        - fair
        - good
        - excellent
      required: true
      description: "Overall quality of sleep"

    - id: sleep_duration
      name: "sleep_duration"
      display_name: "Sleep Duration"
      type: categorical
      values:
        - less_than_6
        - 6_7_hours
        - 7_8_hours
        - 8_plus_hours
      required: false
      description: "Average hours of sleep per night"

    - id: recovery_time_needed
      name: "recovery_time_needed"
      display_name: "Recovery Time Between Sessions"
      type: categorical
      values:
        - 24_hours
        - 48_hours
        - 72_hours
        - more_than_72
      required: false
      description: "Time needed to recover between training same muscle groups"

    # Demographic attributes
    - id: age_group
      name: "age_group"
      display_name: "Age Group"
      type: categorical
      values:
        - 18_25
        - 26_35
        - 36_45
        - 46_plus
      required: true
      description: "Age range for dosing and recommendations"

    - id: gender
      name: "gender"
      display_name: "Gender"
      type: categorical
      values:
        - female
        - male
        - other
      required: true
      description: "Gender for personalized recommendations"

    - id: body_weight
      name: "body_weight"
      display_name: "Body Weight Category"
      type: categorical
      values:
        - under_60kg
        - 60_75kg
        - 75_90kg
        - over_90kg
      required: false
      description: "Body weight for protein dosing calculations"

  # ============================================================================
  # INGREDIENTS - Muscle building and recovery nutrients
  # ============================================================================
  ingredients:
    # PROTEIN SOURCES
    - id: whey_protein_isolate
      name: "whey_protein_isolate"
      display_name: "Whey Protein Isolate"
      function: "fast_absorbing_muscle_protein_synthesis"
      category: "protein"
      strength_levels: ["20g", "25g", "30g", "31g"]
      bioavailability: "very_high"
      absorption_speed: "fast"  # 1-2 hours
      description: "Fastest-absorbing complete protein, ideal for post-workout muscle recovery"

    - id: whey_protein_concentrate
      name: "whey_protein_concentrate"
      display_name: "Whey Protein Concentrate"
      function: "complete_protein_muscle_building"
      category: "protein"
      strength_levels: ["24g", "27g"]
      bioavailability: "high"
      absorption_speed: "fast"
      description: "Cost-effective complete protein with slightly more carbs and fats"

    - id: whey_protein_blend
      name: "whey_protein_blend"
      display_name: "Whey Protein Isolate + Concentrate Blend"
      function: "balanced_absorption_muscle_support"
      category: "protein"
      strength_levels: ["24g", "26g"]
      bioavailability: "high"
      absorption_speed: "moderate_fast"
      description: "Balanced blend for sustained muscle protein synthesis"

    - id: plant_protein
      name: "plant_protein"
      display_name: "Plant Protein (Pea/Rice/Hemp)"
      function: "vegan_muscle_building_protein"
      category: "protein"
      strength_levels: ["20g", "22g", "25g"]
      bioavailability: "moderate_high"
      absorption_speed: "moderate"
      description: "Complete plant-based protein for vegan muscle building"

    - id: vegan_collagen
      name: "vegan_collagen"
      display_name: "Vegan Collagen Precursors"
      function: "plant_based_connective_tissue_support"
      category: "protein"
      strength_levels: ["varies"]
      bioavailability: "moderate"
      description: "Plant-based amino acids and nutrients to support collagen synthesis"

    # AMINO ACIDS
    - id: bcaa
      name: "bcaa"
      display_name: "BCAA (Leucine, Isoleucine, Valine)"
      function: "prevent_muscle_breakdown_stimulate_synthesis"
      category: "amino_acids"
      strength_levels: ["5g", "7g", "10g"]
      ratio: "2:1:1"
      description: "Prevents muscle breakdown during training, stimulates protein synthesis"

    - id: eaa
      name: "eaa"
      display_name: "EAA (Essential Amino Acids)"
      function: "complete_amino_acid_profile_muscle_growth"
      category: "amino_acids"
      strength_levels: ["10g", "15g", "20g"]
      description: "All 9 essential amino acids for comprehensive muscle support"

    - id: leucine
      name: "leucine"
      display_name: "Leucine"
      function: "mtor_activation_muscle_protein_synthesis"
      category: "amino_acids"
      strength_levels: ["3g", "5g"]
      description: "Key amino acid that activates mTOR pathway for muscle growth"

    - id: glutamine
      name: "glutamine"
      display_name: "L-Glutamine"
      function: "muscle_recovery_immune_support"
      category: "amino_acids"
      strength_levels: ["5g", "10g", "15g"]
      description: "Supports muscle recovery and immune function during intense training"

    - id: hmb
      name: "hmb"
      display_name: "HMB (Beta-Hydroxy Beta-Methylbutyrate)"
      function: "reduce_muscle_breakdown_enhance_recovery"
      category: "amino_acids"
      strength_levels: ["1.5g", "3g"]
      description: "Metabolite of leucine that reduces muscle breakdown"

    # PERFORMANCE & STRENGTH
    - id: creatine_monohydrate
      name: "creatine_monohydrate"
      display_name: "Creatine Monohydrate"
      function: "strength_power_muscle_energy_atp"
      category: "performance"
      strength_levels: ["3g", "5g"]
      loading_phase: "20g for 5-7 days"
      maintenance: "3-5g daily"
      description: "Increases muscle strength, power output, and muscle mass"

    - id: creatine_hcl
      name: "creatine_hcl"
      display_name: "Creatine HCL"
      function: "enhanced_absorption_creatine"
      category: "performance"
      strength_levels: ["750mg", "1.5g"]
      description: "More soluble form of creatine with enhanced absorption"

    - id: beta_alanine
      name: "beta_alanine"
      display_name: "Beta-Alanine"
      function: "muscle_endurance_buffer_lactic_acid"
      category: "performance"
      strength_levels: ["2g", "3.2g", "5g"]
      description: "Buffers lactic acid to extend muscle endurance during sets"

    # COLLAGEN & JOINT SUPPORT
    - id: collagen_peptides_marine
      name: "collagen_peptides_marine"
      display_name: "Marine Collagen Peptides"
      function: "joint_tendon_ligament_support"
      category: "collagen"
      strength_levels: ["5g", "10g", "15g"]
      type_profile: "Type I & III"
      description: "Supports joint, tendon, and ligament health for injury prevention"

    - id: collagen_type_ii
      name: "collagen_type_ii"
      display_name: "Collagen Type II (UC-II)"
      function: "cartilage_joint_health"
      category: "collagen"
      strength_levels: ["40mg", "100mg"]
      description: "Specific for cartilage and joint health in athletes"

    - id: gelatin_hydrolyzed
      name: "gelatin_hydrolyzed"
      display_name: "Hydrolyzed Gelatin"
      function: "connective_tissue_repair"
      category: "collagen"
      strength_levels: ["10g", "15g"]
      description: "Breaks down into collagen peptides for tissue repair"

    # MINERALS
    - id: magnesium_glycinate
      name: "magnesium_glycinate"
      display_name: "Magnesium Glycinate"
      function: "muscle_relaxation_protein_synthesis"
      category: "minerals"
      strength_levels: ["200mg", "400mg", "500mg"]
      absorption: "high"
      description: "Supports muscle relaxation, protein synthesis, and recovery"

    - id: magnesium_citrate
      name: "magnesium_citrate"
      display_name: "Magnesium Citrate"
      function: "muscle_function_energy_production"
      category: "minerals"
      strength_levels: ["200mg", "400mg"]
      absorption: "moderate_high"
      description: "Supports muscle contraction and ATP production"

    - id: magnesium_malate
      name: "magnesium_malate"
      display_name: "Magnesium Malate"
      function: "muscle_energy_fatigue_reduction"
      category: "minerals"
      strength_levels: ["200mg", "400mg"]
      absorption: "high"
      description: "Particularly effective for muscle energy and reducing fatigue"

    - id: zinc_picolinate
      name: "zinc_picolinate"
      display_name: "Zinc Picolinate"
      function: "protein_synthesis_testosterone_support"
      category: "minerals"
      strength_levels: ["15mg", "30mg", "50mg"]
      description: "Essential for protein synthesis and testosterone production"

    - id: potassium
      name: "potassium"
      display_name: "Potassium"
      function: "muscle_contraction_electrolyte_balance"
      category: "minerals"
      strength_levels: ["99mg", "200mg"]
      description: "Critical for muscle contraction and preventing cramps"

    - id: calcium
      name: "calcium"
      display_name: "Calcium"
      function: "muscle_contraction_bone_health"
      category: "minerals"
      strength_levels: ["500mg", "1000mg"]
      description: "Essential for muscle contraction signaling"

    # VITAMINS
    - id: vitamin_d3
      name: "vitamin_d3"
      display_name: "Vitamin D3 (Cholecalciferol)"
      function: "muscle_function_testosterone_calcium_absorption"
      category: "vitamins"
      strength_levels: ["1000IU", "2000IU", "5000IU"]
      description: "Supports muscle function, testosterone, and calcium absorption"

    - id: vitamin_c
      name: "vitamin_c"
      display_name: "Vitamin C (Ascorbic Acid)"
      function: "collagen_synthesis_antioxidant_recovery"
      category: "vitamins"
      strength_levels: ["500mg", "1000mg", "2000mg"]
      description: "Required for collagen synthesis and reduces oxidative stress"

    - id: b_complex
      name: "b_complex"
      display_name: "B-Complex Vitamins"
      function: "protein_metabolism_energy_production"
      category: "vitamins"
      components: ["B1", "B2", "B3", "B5", "B6", "B7", "B9", "B12"]
      description: "Essential for protein metabolism and energy production"

    # RECOVERY & ANTI-INFLAMMATORY
    - id: omega_3_epa_dha
      name: "omega_3_epa_dha"
      display_name: "Omega-3 (EPA & DHA)"
      function: "reduce_inflammation_enhance_recovery"
      category: "fatty_acids"
      strength_levels: ["1000mg", "2000mg", "3000mg", "4000mg"]
      ratio: "EPA:DHA varies"
      description: "Reduces muscle inflammation and accelerates recovery"

    - id: curcumin
      name: "curcumin"
      display_name: "Curcumin (Turmeric)"
      function: "anti_inflammatory_muscle_recovery"
      category: "botanicals"
      strength_levels: ["500mg", "1000mg"]
      enhanced_absorption: "black_pepper_piperine"
      description: "Powerful anti-inflammatory for muscle soreness and recovery"

    - id: tart_cherry_extract
      name: "tart_cherry_extract"
      display_name: "Tart Cherry Extract"
      function: "reduce_doms_anti_inflammatory"
      category: "botanicals"
      strength_levels: ["480mg", "1000mg"]
      description: "Clinically proven to reduce DOMS and speed recovery"

    # ADAPTOGENS
    - id: ashwagandha
      name: "ashwagandha"
      display_name: "Ashwagandha (KSM-66)"
      function: "strength_muscle_mass_cortisol_reduction"
      category: "adaptogens"
      strength_levels: ["300mg", "600mg"]
      standardization: "5% withanolides"
      description: "Increases strength, muscle mass, and reduces cortisol"

    # PROBIOTICS (for protein absorption)
    - id: probiotics_multi_strain
      name: "probiotics_multi_strain"
      display_name: "Multi-Strain Probiotics"
      function: "protein_absorption_gut_health"
      category: "probiotics"
      strength_levels: ["3B CFU", "4B CFU", "10B CFU"]
      description: "Enhances protein absorption and gut health"

  # ============================================================================
  # CONSTRAINTS - Safety and contraindications
  # ============================================================================
  constraints:
    - id: kidney_disease
      name: "kidney_disease"
      display_name: "Kidney Disease"
      severity: high
      description: "Chronic kidney disease or impaired kidney function"

    - id: liver_disease
      name: "liver_disease"
      display_name: "Liver Disease"
      severity: high
      description: "Chronic liver disease or impaired liver function"

    - id: pregnancy
      name: "pregnancy"
      display_name: "Pregnancy"
      severity: high
      description: "Currently pregnant"

    - id: breastfeeding
      name: "breastfeeding"
      display_name: "Breastfeeding"
      severity: moderate
      description: "Currently breastfeeding"

    - id: dairy_allergy
      name: "dairy_allergy"
      display_name: "Dairy/Lactose Allergy"
      severity: high
      description: "Allergy or intolerance to dairy products"

    - id: soy_allergy
      name: "soy_allergy"
      display_name: "Soy Allergy"
      severity: high
      description: "Allergy to soy products"

    - id: shellfish_allergy
      name: "shellfish_allergy"
      display_name: "Shellfish Allergy"
      severity: high
      description: "Allergy to shellfish (relevant for marine collagen)"

    - id: high_blood_pressure
      name: "high_blood_pressure"
      display_name: "High Blood Pressure"
      severity: moderate
      description: "Hypertension or elevated blood pressure"

    - id: diabetes
      name: "diabetes"
      display_name: "Diabetes"
      severity: moderate
      description: "Type 1 or Type 2 diabetes"

# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  problem_requires_attributes:
    - from: muscle_soreness
      to: [training_frequency, training_experience, sleep_quality, current_protein_intake]
      relationship: REQUIRES_KNOWING

    - from: slow_muscle_recovery
      to: [training_frequency, sleep_quality, sleep_duration, current_protein_intake, age_group]
      relationship: REQUIRES_KNOWING

    - from: difficulty_building_muscle
      to: [training_goal, training_experience, current_protein_intake, dietary_preference, meal_frequency]
      relationship: REQUIRES_KNOWING

    - from: strength_plateau
      to: [training_experience, training_frequency, current_protein_intake, sleep_quality]
      relationship: REQUIRES_KNOWING

    - from: inadequate_protein
      to: [dietary_preference, training_goal, body_weight, meal_frequency]
      relationship: REQUIRES_KNOWING

    - from: muscle_breakdown
      to: [training_frequency, current_protein_intake, sleep_duration, dietary_preference]
      relationship: REQUIRES_KNOWING

    - from: joint_pain_training
      to: [age_group, training_type, training_experience, body_weight]
      relationship: REQUIRES_KNOWING

    - from: poor_exercise_endurance
      to: [training_type, training_experience, sleep_quality, current_protein_intake]
      relationship: REQUIRES_KNOWING

    - from: slow_strength_gains
      to: [training_experience, training_frequency, current_protein_intake, sleep_quality]
      relationship: REQUIRES_KNOWING

  # INGREDIENT → TREATS → PROBLEM
  ingredient_treats_problem:
    # Protein treats muscle building and recovery issues
    - from: whey_protein_isolate
      to: difficulty_building_muscle
      relationship: TREATS
      efficacy: 0.95
      mechanism: "Fast-absorbing complete protein maximizes muscle protein synthesis"
      evidence_level: "clinical_trial"
      onset: "2-8 weeks"

    - from: whey_protein_isolate
      to: slow_muscle_recovery
      relationship: TREATS
      efficacy: 0.90
      mechanism: "Rapid amino acid delivery accelerates muscle repair"
      evidence_level: "clinical_trial"
      onset: "24-48 hours"

    - from: whey_protein_isolate
      to: inadequate_protein
      relationship: TREATS
      efficacy: 0.95
      mechanism: "Provides 25-31g complete protein per serving"
      evidence_level: "clinical_trial"
      onset: "immediate"

    - from: whey_protein_concentrate
      to: difficulty_building_muscle
      relationship: TREATS
      efficacy: 0.90
      mechanism: "Complete protein supports muscle protein synthesis"
      evidence_level: "clinical_trial"
      onset: "2-8 weeks"

    - from: plant_protein
      to: difficulty_building_muscle
      relationship: TREATS
      efficacy: 0.85
      mechanism: "Plant-based complete protein for vegan muscle building"
      evidence_level: "clinical_trial"
      onset: "2-8 weeks"

    - from: plant_protein
      to: inadequate_protein
      relationship: TREATS
      efficacy: 0.90
      mechanism: "Provides 20-25g plant protein per serving"
      evidence_level: "clinical_trial"
      onset: "immediate"

    # BCAA/EAA for recovery and muscle preservation
    - from: bcaa
      to: muscle_soreness
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Reduces muscle damage markers and DOMS"
      evidence_level: "clinical_trial"
      onset: "24-72 hours"

    - from: bcaa
      to: muscle_breakdown
      relationship: TREATS
      efficacy: 0.85
      mechanism: "Prevents catabolism during and after training"
      evidence_level: "clinical_trial"
      onset: "during workout"

    - from: bcaa
      to: slow_muscle_recovery
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Stimulates muscle protein synthesis and reduces breakdown"
      evidence_level: "clinical_trial"
      onset: "24-48 hours"

    - from: eaa
      to: difficulty_building_muscle
      relationship: TREATS
      efficacy: 0.90
      mechanism: "Complete essential amino acid profile optimizes muscle growth"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    - from: glutamine
      to: slow_muscle_recovery
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Supports muscle glycogen replenishment and immune function"
      evidence_level: "clinical_trial"
      onset: "24-48 hours"

    # Creatine for strength and muscle mass
    - from: creatine_monohydrate
      to: strength_plateau
      relationship: TREATS
      efficacy: 0.95
