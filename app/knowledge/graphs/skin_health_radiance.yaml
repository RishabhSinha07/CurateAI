      efficacy: 0.70
      onset_time: "12-16 weeks"
      evidence_level: "anecdotal"

  # HYALURONIC ACID for Hydration & Plumping
  - source: hyaluronic_acid
    target: dehydration
    relation: TREATS
    properties:
      mechanism: "Binds water molecules to increase skin moisture content"
      efficacy: 0.85
      onset_time: "4-8 weeks"
      evidence_level: "clinical_trial"

  - source: hyaluronic_acid
    target: fine_lines
    relation: TREATS
    properties:
      mechanism: "Plumps skin and reduces appearance of fine lines through hydration"
      efficacy: 0.75
      onset_time: "4-8 weeks"
      evidence_level: "clinical_trial"

  # VITAMIN C for Collagen Synthesis & Brightening
  - source: vitamin_c
    target: dull_skin
    relation: TREATS
    properties:
      mechanism: "Promotes skin radiance through antioxidant protection and melanin regulation"
      efficacy: 0.85
      onset_time: "4-8 weeks"
      evidence_level: "clinical_trial"

  - source: vitamin_c
    target: wrinkles
    relation: TREATS
    properties:
      mechanism: "Essential cofactor for collagen synthesis enzymes"
      efficacy: 0.80
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  - source: vitamin_c
    target: uneven_tone
    relation: TREATS
    properties:
      mechanism: "Inhibits tyrosinase to reduce hyperpigmentation"
      efficacy: 0.75
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  - source: vitamin_c_liposomal
