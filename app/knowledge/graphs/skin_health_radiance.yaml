  - source: vitamin_e
    target: wrinkles
    relation: TREATS
    properties:
      mechanism: "Protects collagen from free radical damage"
      efficacy: 0.70
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  # GLUTATHIONE for Master Antioxidant & Brightening
  - source: glutathione
    target: dull_skin
    relation: TREATS
    properties:
      mechanism: "Master antioxidant that promotes skin radiance and cellular health"
      efficacy: 0.85
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  - source: glutathione
    target: oxidative_stress
    relation: TREATS
    properties:
      mechanism: "Master antioxidant that regenerates other antioxidants and neutralizes free radicals"
      efficacy: 0.95
      onset_time: "4-8 weeks"
      evidence_level: "clinical_trial"

  - source: glutathione
    target: uneven_tone
    relation: TREATS
    properties:
      mechanism: "Inhibits melanin synthesis for even skin tone"
      efficacy: 0.80
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  - source: glutathione_liposomal
    target: dull_skin
    relation: TREATS
    properties:
      mechanism: "Enhanced bioavailability for superior skin brightening"
      efficacy: 0.90
      onset_time: "6-10 weeks"
      evidence_level: "clinical_trial"

  # ZINC for Collagen Synthesis & Skin Repair
  - source: zinc
    target: wrinkles
