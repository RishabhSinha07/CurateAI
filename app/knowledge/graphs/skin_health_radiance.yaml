# Skin Health & Radiance Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on skin health, radiance, anti-aging, and beauty from within.
#
# UPDATING THIS GRAPH:
# 1. Add new nodes under the appropriate section (problems, attributes, etc.)
# 2. Ensure all IDs are unique and use snake_case
# 3. Add edges to connect new nodes to existing ones
# 4. Run validation: python -m app.knowledge.validate skin_health_radiance
# 5. Reload graph in development: reload_graph('skin_health_radiance')

metadata:
  domain: skin_health_radiance
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for skin health & radiance nutraceutical recommendations"
  display_name: "Skin Health & Radiance"
  persona: "You are a beauty and wellness nutrition specialist who helps users find science-backed nutraceutical supplements for skin health, radiance, and anti-aging. You focus on collagen, vitamins, antioxidants, and minerals that support skin from within. You consider dietary preferences, age, and specific skin concerns to provide personalized recommendations."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Consumer skin health concerns and wellness goals
  # ============================================================================
  problems:
    - id: poor_elasticity
      name: "poor_elasticity"
      display_name: "Loss of Skin Elasticity"
      synonyms:
        - "sagging skin"
        - "loose skin"
        - "skin firmness"
        - "loss of firmness"
        - "lack of bounce"
        - "skin laxity"
      severity_levels: [mild, moderate, severe]
      description: "Loss of skin's ability to bounce back and maintain firmness"

    - id: dull_skin
      name: "dull_skin"
      display_name: "Dull & Lackluster Skin"
      synonyms:
        - "dull"
        - "dull skin"
        - "dull complexion"
        - "lack of glow"
        - "tired skin"
        - "lackluster skin"
        - "no radiance"
      severity_levels: [mild, moderate, severe]
      description: "Skin that lacks natural radiance and appears tired or lifeless"

    - id: dehydration
      name: "dehydration"
      display_name: "Skin Dehydration"
      synonyms:
        - "dry skin"
        - "skin dryness"
        - "lack of moisture"
        - "dehydrated skin"
        - "flaky skin"
        - "tight skin"
      severity_levels: [mild, moderate, severe]
      description: "Lack of water content in the skin leading to tightness and flaking"

    - id: fine_lines
      name: "fine_lines"
      display_name: "Fine Lines"
      synonyms:
        - "early wrinkles"
        - "expression lines"
        - "smile lines"
        - "forehead lines"
        - "eye wrinkles"
      severity_levels: [mild, moderate, severe]
      description: "Small, shallow wrinkles that appear with age and facial expressions"

    - id: wrinkles
      name: "wrinkles"
      display_name: "Deep Wrinkles"
      synonyms:
        - "deep lines"
        - "aging lines"
        - "creases"
        - "skin aging"
        - "crow's feet"
        - "nasolabial folds"
      severity_levels: [mild, moderate, severe]
      description: "Deeper creases and folds in the skin due to collagen loss and aging"

    - id: uneven_tone
      name: "uneven_tone"
      display_name: "Uneven Skin Tone"
      synonyms:
        - "dark spots"
        - "hyperpigmentation"
        - "discoloration"
        - "patchy skin"
        - "age spots"
      severity_levels: [mild, moderate, severe]
      description: "Inconsistent skin color with patches of darker or lighter areas"

    - id: oxidative_stress
      name: "oxidative_stress"
      display_name: "Oxidative Stress & Free Radical Damage"
      synonyms:
        - "free radical damage"
        - "environmental damage"
        - "pollution damage"
        - "sun damage"
        - "premature aging"
      severity_levels: [mild, moderate, severe]
      description: "Cellular damage from environmental stressors and free radicals"

    - id: weak_nails_hair
      name: "weak_nails_hair"
      display_name: "Weak Nails & Hair"
      synonyms:
        - "brittle nails"
        - "weak hair"
        - "hair breakage"
        - "nail breakage"
        - "thin hair"
      severity_levels: [mild, moderate, severe]
      description: "Brittle, weak nails and hair that lack strength and shine"

