    properties:
      mechanism: "Binds water molecules to increase skin moisture content"
      efficacy: 0.85
      onset_time: "4-8 weeks"
      evidence_level: "clinical_trial"

  - source: hyaluronic_acid
    target: fine_lines
    relation: TREATS
    properties:
      mechanism: "Plumps skin and reduces appearance of fine lines through hydration"
