    properties:
      mechanism: "Provides amino acids and cofactors to support natural collagen synthesis"
      efficacy: 0.70
      onset_time: "12-16 weeks"
      evidence_level: "anecdotal"

  # HYALURONIC ACID for Hydration & Plumping
  - source: hyaluronic_acid
    target: dry_skin
