      efficacy: 0.70
      onset_time: "8-12 weeks"
      evidence_level: "anecdotal"

  # OMEGA-3 for Hydration
  - source: omega_3
    target: dry_skin
    relation: TREATS
    properties:
      mechanism: "Supports skin barrier function and moisture retention"
      efficacy: 0.75
      onset_time: "4-8 weeks"
