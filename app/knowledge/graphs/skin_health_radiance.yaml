    relation: TREATS
    properties:
      mechanism: "Enhanced absorption for superior collagen synthesis support"
      efficacy: 0.88
      onset_time: "6-10 weeks"
      evidence_level: "clinical_trial"

  # VITAMIN E for Antioxidant Protection
  - source: vitamin_e
