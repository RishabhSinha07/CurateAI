  # INGREDIENT → RECOMMENDED_FOR → ATTRIBUTE / CONSTRAINT
  # Defines which ingredients work best for specific user attributes
  # --------------------------------------------------------------------------

  # Marine Collagen for Non-Veg/Pescatarian
  - source: collagen_type_1_3_marine
    target: diet_pescatarian_constraint
