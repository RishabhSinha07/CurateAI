# Skin Health & Radiance Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on skin health, radiance, anti-aging, and beauty from within.
#
# UPDATING THIS GRAPH:
# 1. Add new nodes under the appropriate section (problems, attributes, etc.)
# 2. Ensure all IDs are unique and use snake_case
# 3. Add edges to connect new nodes to existing ones
# 4. Run validation: python -m app.knowledge.validate skin_health_radiance
# 5. Reload graph in development: reload_graph('skin_health_radiance')

metadata:
  domain: skin_health_radiance
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for skin health & radiance nutraceutical recommendations"
  display_name: "Skin Health & Radiance"
  persona: "You are a beauty and wellness nutrition specialist who helps users find science-backed nutraceutical supplements for skin health, radiance, and anti-aging. You focus on collagen, vitamins, antioxidants, and minerals that support skin from within. You consider dietary preferences, age, and specific skin concerns to provide personalized recommendations."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Consumer skin health concerns and wellness goals
  # ============================================================================
  problems:
    - id: poor_elasticity
      name: "poor_elasticity"
      display_name: "Loss of Skin Elasticity"
      synonyms:
        - "sagging skin"
        - "loose skin"
        - "skin firmness"
        - "loss of firmness"
        - "lack of bounce"
        - "skin laxity"
      severity_levels: [mild, moderate, severe]
      description: "Loss of skin's ability to bounce back and maintain firmness"

    - id: dull_skin
      name: "dull_skin"
      display_name: "Dull & Lackluster Skin"
      synonyms:
        - "dull"
        - "dull skin"
        - "dull complexion"
        - "lack of glow"
        - "tired skin"
        - "lackluster skin"
        - "no radiance"
      severity_levels: [mild, moderate, severe]
      description: "Skin that lacks natural radiance and appears tired or lifeless"

    - id: dry_skin
      name: "dry_skin"
      display_name: "Dry Skin"
      synonyms:
        - "dry skin"
        - "skin dryness"
        - "lack of moisture"
        - "dehydrated skin"
        - "flaky skin"
        - "tight skin"
        - "dehydration"
      severity_levels: [mild, moderate, severe]
      description: "Lack of moisture in the skin leading to tightness and flaking"

    - id: fine_lines
      name: "fine_lines"
      display_name: "Fine Lines"
      synonyms:
        - "early wrinkles"
        - "expression lines"
        - "smile lines"
        - "forehead lines"
        - "eye wrinkles"
      severity_levels: [mild, moderate, severe]
      description: "Small, shallow wrinkles that appear with age and facial expressions"

    - id: wrinkles
      name: "wrinkles"
      display_name: "Deep Wrinkles"
      synonyms:
        - "deep lines"
        - "aging lines"
        - "creases"
        - "skin aging"
        - "crow's feet"
        - "nasolabial folds"
      severity_levels: [mild, moderate, severe]
      description: "Deeper creases and folds in the skin due to collagen loss and aging"

    - id: uneven_tone
      name: "uneven_tone"
      display_name: "Uneven Skin Tone"
      synonyms:
        - "dark spots"
        - "hyperpigmentation"
        - "discoloration"
        - "patchy skin"
        - "age spots"
      severity_levels: [mild, moderate, severe]
      description: "Inconsistent skin color with patches of darker or lighter areas"

  # ============================================================================
  # ATTRIBUTES - User characteristics that influence recommendations
  # ============================================================================
  attributes:
    # Age Group - Critical for anti-aging recommendations
    - id: age_group_18_25
      category: age_group
      value: "18-25"
      data_type: single_choice
      elicitation_priority: 1
      is_global: true

    - id: age_group_26_35
      category: age_group
      value: "26-35"
      data_type: single_choice
      elicitation_priority: 1
      is_global: true

    - id: age_group_36_45
      category: age_group
      value: "36-45"
      data_type: single_choice
      elicitation_priority: 1
      is_global: true

    - id: age_group_46_plus
      category: age_group
      value: "46+"
      data_type: single_choice
      elicitation_priority: 1
      is_global: true

    # Skin Type
    - id: skin_type_dry
      category: skin_type
      value: dry
      data_type: single_choice
      elicitation_priority: 2
      is_global: false

    - id: skin_type_oily
      category: skin_type
      value: oily
      data_type: single_choice
      elicitation_priority: 2
      is_global: false

    - id: skin_type_combination
      category: skin_type
      value: combination
      data_type: single_choice
      elicitation_priority: 2
      is_global: false

    - id: skin_type_normal
      category: skin_type
      value: normal
      data_type: single_choice
      elicitation_priority: 2
      is_global: false

    - id: skin_type_sensitive
      category: skin_type
      value: sensitive
      data_type: single_choice
      elicitation_priority: 2
      is_global: false

    # Sun Exposure
    - id: sun_exposure_minimal
      category: sun_exposure
      value: minimal
      data_type: single_choice
      elicitation_priority: 3
      is_global: false

    - id: sun_exposure_moderate
      category: sun_exposure
      value: moderate
      data_type: single_choice
      elicitation_priority: 3
      is_global: false

    - id: sun_exposure_high
      category: sun_exposure
      value: high
      data_type: single_choice
      elicitation_priority: 3
      is_global: false

  # ============================================================================
  # INGREDIENTS - Key actives for skin health & radiance
  # ============================================================================
  ingredients:
    # COLLAGEN - Types I & III
    - id: collagen_type_1_3_marine
      name: "collagen_type_1_3_marine"
      display_name: "Marine Collagen (Type I & III)"
      function: "skin_elasticity_hydration"
      category: "collagen"
      strength_levels: ["5g", "10g", "15g"]

    - id: collagen_type_1_3_bovine
      name: "collagen_type_1_3_bovine"
      display_name: "Bovine Collagen (Type I & III)"
      function: "skin_elasticity_hydration"
      category: "collagen"
      strength_levels: ["5g", "10g", "15g"]

    - id: vegan_collagen_builder
      name: "vegan_collagen_builder"
      display_name: "Vegan Collagen Builder"
      function: "collagen_synthesis_support"
      category: "collagen"
      strength_levels: ["standard"]

    # HYALURONIC ACID
    - id: hyaluronic_acid
      name: "hyaluronic_acid"
      display_name: "Hyaluronic Acid"
      function: "hydration_plumping"
      category: "beauty"
      strength_levels: ["50mg", "100mg", "200mg"]

    # VITAMIN C
    - id: vitamin_c
      name: "vitamin_c"
      display_name: "Vitamin C (Ascorbic Acid)"
      function: "collagen_synthesis_brightening"
      category: "vitamins"
      strength_levels: ["500mg", "1000mg", "2000mg"]

    - id: vitamin_c_liposomal
      name: "vitamin_c_liposomal"
      display_name: "Liposomal Vitamin C"
      function: "enhanced_absorption_collagen_synthesis"
      category: "vitamins"
      strength_levels: ["500mg", "1000mg"]

    # VITAMIN E
    - id: vitamin_e
      name: "vitamin_e"
      display_name: "Vitamin E (Tocopherol)"
      function: "antioxidant_protection"
      category: "vitamins"
      strength_levels: ["200 IU", "400 IU", "800 IU"]

    # GLUTATHIONE
    - id: glutathione
      name: "glutathione"
      display_name: "Glutathione"
      function: "master_antioxidant_brightening"
      category: "antioxidants"
      strength_levels: ["250mg", "500mg", "1000mg"]

    - id: glutathione_liposomal
      name: "glutathione_liposomal"
      display_name: "Liposomal Glutathione"
      function: "enhanced_absorption_antioxidant"
      category: "antioxidants"
      strength_levels: ["250mg", "500mg"]

    # ZINC
    - id: zinc
      name: "zinc"
      display_name: "Zinc"
      function: "collagen_synthesis_skin_repair"
      category: "minerals"
      strength_levels: ["15mg", "25mg", "50mg"]

    # OTHER ANTIOXIDANTS
    - id: astaxanthin
      name: "astaxanthin"
      display_name: "Astaxanthin"
      function: "powerful_antioxidant_uv_protection"
      category: "antioxidants"
      strength_levels: ["4mg", "8mg", "12mg"]

    - id: resveratrol
      name: "resveratrol"
      display_name: "Resveratrol"
      function: "antioxidant_anti_aging"
      category: "antioxidants"
      strength_levels: ["100mg", "250mg", "500mg"]

    - id: coq10
      name: "coq10"
      display_name: "Coenzyme Q10 (CoQ10)"
      function: "cellular_energy_antioxidant"
      category: "antioxidants"
      strength_levels: ["100mg", "200mg", "300mg"]

    - id: vitamin_a
      name: "vitamin_a"
      display_name: "Vitamin A (Retinol Precursor)"
      function: "skin_renewal_cell_turnover"
      category: "vitamins"
      strength_levels: ["2500 IU", "5000 IU", "10000 IU"]

    # SUPPORTING NUTRIENTS
    - id: biotin
      name: "biotin"
      display_name: "Biotin (Vitamin B7)"
      function: "hair_skin_nail_health"
      category: "vitamins"
      strength_levels: ["5000mcg", "10000mcg"]

    - id: selenium
      name: "selenium"
      display_name: "Selenium"
      function: "antioxidant_thyroid_support"
      category: "minerals"
      strength_levels: ["55mcg", "100mcg", "200mcg"]

    - id: silica
      name: "silica"
      display_name: "Silica (Bamboo Extract)"
      function: "collagen_support_hair_nails"
      category: "minerals"
      strength_levels: ["standard"]

    - id: omega_3
      name: "omega_3"
      display_name: "Omega-3 Fatty Acids"
      function: "inflammation_reduction_hydration"
      category: "beauty"
      strength_levels: ["500mg", "1000mg", "2000mg"]

  # ============================================================================
  # CONSTRAINTS - User limitations that exclude certain products
  # ============================================================================
  constraints:
    - id: allergy_shellfish
      type: "allergy"
      value: "shellfish"
      severity: "hard"

    - id: allergy_fish
      type: "allergy"
      value: "fish"
      severity: "hard"

    - id: diet_vegan_constraint
      type: "dietary"
      value: "vegan"
      severity: "hard"

    - id: diet_vegetarian_constraint
      type: "dietary"
      value: "vegetarian"
      severity: "hard"

    - id: diet_pescatarian_constraint
      type: "dietary"
      value: "pescatarian"
      severity: "soft"

    - id: diet_non_veg_constraint
      type: "dietary"
      value: "non_vegetarian"
      severity: "soft"

  # ============================================================================
  # QUESTIONS - Templates for eliciting information
  # ============================================================================
  questions:
    - id: q_primary_skin_concern
      text: "What is your primary skin concern?"
      response_type: "single_choice"
      options:
        - "Loss of elasticity/firmness"
        - "Dull, tired-looking skin"
        - "Dry skin"
        - "Fine lines"
        - "Deep wrinkles"
        - "Uneven skin tone/dark spots"
        - "Overall anti-aging"

    - id: q_age_group
      text: "What is your age group?"
      response_type: "single_choice"
      options:
        - "18-25"
        - "26-35"
        - "36-45"
        - "46+"

    - id: q_diet
      text: "What is your dietary preference?"
      response_type: "single_choice"
      options:
        - "Vegetarian"
        - "Vegan"
        - "Pescatarian"
        - "Non-vegetarian"

    - id: q_collagen_preference
      text: "Do you have a preference for collagen type?"
      response_type: "single_choice"
      options:
        - "Marine collagen (fish-derived)"
        - "Bovine collagen (grass-fed)"
        - "Vegan collagen builder"
        - "No preference"

    - id: q_skin_type
      text: "What is your skin type?"
      response_type: "single_choice"
      options:
        - "Dry"
        - "Oily"
        - "Combination"
        - "Normal"
        - "Sensitive"

    - id: q_sun_exposure
      text: "How much daily sun exposure do you get?"
      response_type: "single_choice"
      options:
        - "Minimal (mostly indoors)"
        - "Moderate (1-2 hours outdoors)"
        - "High (3+ hours outdoors)"

    - id: q_allergies
      text: "Do you have any of these allergies?"
      response_type: "multi_choice"
      options:
        - "Fish allergy"
        - "Shellfish allergy"
        - "No allergies"
      validation_rules:
        allow_none: true

# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # --------------------------------------------------------------------------
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  # All problems require knowing age, skin type, and sun exposure
  # --------------------------------------------------------------------------

  # Poor Elasticity
  - source: poor_elasticity
    target: age_group_18_25
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age determines collagen loss severity and appropriate dosage"

  - source: poor_elasticity
    target: skin_type_dry
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: false
      reason: "Skin type influences product format and hydration needs"

  - source: poor_elasticity
    target: sun_exposure_minimal
    relation: REQUIRES_KNOWING
    properties:
      priority: 3
      is_optional: false
      reason: "Sun exposure accelerates collagen breakdown"

  # Dull Skin
  - source: dull_skin
    target: age_group_18_25
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age affects skin cell turnover rate"

  - source: dull_skin
    target: skin_type_dry
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: false
      reason: "Skin type determines hydration and radiance strategy"

  - source: dull_skin
    target: sun_exposure_minimal
    relation: REQUIRES_KNOWING
    properties:
      priority: 3
      is_optional: false
      reason: "Sun exposure affects antioxidant and brightening needs"

  # Dry Skin
  - source: dry_skin
    target: age_group_18_25
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Aging affects skin's moisture retention capacity"

  - source: dry_skin
    target: skin_type_dry
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: false
      reason: "Skin type determines hydration strategy"

  - source: dry_skin
    target: sun_exposure_minimal
    relation: REQUIRES_KNOWING
    properties:
      priority: 3
      is_optional: false
      reason: "Sun exposure contributes to moisture loss"

  # Fine Lines
  - source: fine_lines
    target: age_group_18_25
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age determines appropriate anti-aging intervention"

  - source: fine_lines
    target: skin_type_dry
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: false
      reason: "Dry skin accentuates fine lines"

  - source: fine_lines
    target: sun_exposure_minimal
    relation: REQUIRES_KNOWING
    properties:
      priority: 3
      is_optional: false
      reason: "Sun exposure accelerates fine line formation"

  # Wrinkles
  - source: wrinkles
    target: age_group_18_25
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age determines collagen supplementation approach"

  - source: wrinkles
    target: skin_type_dry
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: false
      reason: "Skin type affects wrinkle depth and treatment approach"

  - source: wrinkles
    target: sun_exposure_minimal
    relation: REQUIRES_KNOWING
    properties:
      priority: 3
      is_optional: false
      reason: "Sun exposure is a primary cause of deep wrinkles"

  # Uneven Tone
  - source: uneven_tone
    target: age_group_18_25
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age influences pigmentation patterns and treatment options"

  - source: uneven_tone
    target: skin_type_dry
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: false
      reason: "Skin type affects pigmentation and brightening approach"

  - source: uneven_tone
    target: sun_exposure_minimal
    relation: REQUIRES_KNOWING
    properties:
      priority: 3
      is_optional: false
      reason: "Sun exposure is a primary driver of hyperpigmentation"

  # --------------------------------------------------------------------------
  # ATTRIBUTE → ELICITS_QUESTION → QUESTION
  # Maps attributes to questions that elicit them
  # --------------------------------------------------------------------------

  - source: age_group_18_25
    target: q_age_group
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  - source: skin_type_dry
    target: q_skin_type
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  - source: sun_exposure_minimal
    target: q_sun_exposure
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  # CONSTRAINT → ELICITS_QUESTION → QUESTION

  - source: diet_vegan_constraint
    target: q_diet
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  - source: allergy_fish
    target: q_allergies
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"
      is_safety_critical: true

  - source: allergy_shellfish
    target: q_allergies
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"
      is_safety_critical: true

  # --------------------------------------------------------------------------
  # INGREDIENT → TREATS → PROBLEM
  # Defines which ingredients are effective for which problems
  # --------------------------------------------------------------------------

  # COLLAGEN for Elasticity & Wrinkles
  - source: collagen_type_1_3_marine
