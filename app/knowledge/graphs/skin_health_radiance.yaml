  # ============================================================================
  # CONSTRAINTS - User limitations that exclude certain products
  # ============================================================================
  constraints:
    - id: allergy_shellfish
      type: "allergy"
      value: "shellfish"
      severity: "hard"

    - id: allergy_fish
      type: "allergy"
      value: "fish"
      severity: "hard"

    - id: diet_vegan_constraint
      type: "dietary"
      value: "vegan"
      severity: "hard"

    - id: diet_vegetarian_constraint
      type: "dietary"
      value: "vegetarian"
      severity: "hard"

  # ============================================================================
  # QUESTIONS - Templates for eliciting information
  # ============================================================================
  questions:
    - id: q_primary_skin_concern
      text: "What is your primary skin concern?"
      response_type: "single_choice"
      options:
        - "Loss of elasticity/firmness"
        - "Dull, tired-looking skin"
        - "Dryness and dehydration"
        - "Fine lines"
        - "Deep wrinkles"
        - "Uneven skin tone/dark spots"
        - "Overall anti-aging"

    - id: q_age_group
      text: "What is your age group?"
      response_type: "single_choice"
      options:
        - "18-25"
        - "26-35"
        - "36-45"
        - "46+"

    - id: q_diet
      text: "What is your dietary preference?"
      response_type: "single_choice"
      options:
        - "Vegetarian"
        - "Vegan"
        - "Pescatarian"
        - "Non-vegetarian"

    - id: q_collagen_preference
      text: "Do you have a preference for collagen type?"
      response_type: "single_choice"
      options:
        - "Marine collagen (fish-derived)"
        - "Bovine collagen (grass-fed)"
        - "Vegan collagen builder"
        - "No preference"

    - id: q_skin_type
      text: "What is your skin type?"
      response_type: "single_choice"
      options:
        - "Dry"
        - "Oily"
        - "Combination"
        - "Normal"
        - "Sensitive"

    - id: q_sun_exposure
      text: "How much daily sun exposure do you get?"
      response_type: "single_choice"
      options:
        - "Minimal (mostly indoors)"
        - "Moderate (1-2 hours outdoors)"
        - "High (3+ hours outdoors)"

    - id: q_lifestyle_stress
      text: "How would you describe your stress levels?"
      response_type: "single_choice"
      options:
        - "High stress/demanding lifestyle"
        - "Moderate stress"
        - "Low stress/relaxed"

    - id: q_gender
      text: "What is your gender?"
      response_type: "single_choice"
      options:
        - "Female"
        - "Male"
        - "Prefer not to say"

    - id: q_allergies
      text: "Do you have any of these allergies?"
      response_type: "multi_choice"
      options:
        - "Fish allergy"
        - "Shellfish allergy"
        - "No allergies"
      validation_rules:
        allow_none: true

# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # --------------------------------------------------------------------------
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  # Defines which attributes are needed to recommend solutions for a problem
  # --------------------------------------------------------------------------

  # Poor Elasticity requires knowing age and diet (for collagen type)
  - source: poor_elasticity
    target: age_group_18_25
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age determines collagen loss severity and appropriate dosage"

  - source: poor_elasticity
    target: diet_vegan
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Dietary preference determines collagen source (marine/bovine vs vegan builder)"

  # Dull Skin
  - source: dull_skin
    target: age_group_26_35
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Age affects skin cell turnover rate"

  - source: dull_skin
    target: skin_type_dry
    relation: REQUIRES_KNOWING
    properties:
      priority: 3
      is_optional: true
      reason: "Dry skin may need additional hydration support"

  # Dehydration
  - source: dehydration
    target: skin_type_dry
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Skin type determines hydration strategy"

  - source: dehydration
    target: age_group_36_45
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Aging affects skin's moisture retention capacity"

  # Fine Lines & Wrinkles
  - source: fine_lines
    target: age_group_26_35
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age determines appropriate anti-aging intervention"

  - source: fine_lines
    target: sun_exposure_minimal
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Sun exposure affects antioxidant needs"

  - source: wrinkles
    target: age_group_36_45
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Age determines collagen supplementation approach"

  - source: wrinkles
    target: diet_vegan
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Determines collagen source availability"

  # Oxidative Stress
  - source: oxidative_stress
    target: sun_exposure_high
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Sun exposure determines antioxidant dosage needs"

  - source: oxidative_stress
    target: lifestyle_stressful
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Lifestyle stress increases free radical production"

  # Weak Nails & Hair
  - source: weak_nails_hair
    target: diet_vegetarian
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: true
      reason: "Plant-based diets may need additional biotin and minerals"

  # --------------------------------------------------------------------------
  # ATTRIBUTE → ELICITS_QUESTION → QUESTION
  # Maps attributes to questions that elicit them
  # --------------------------------------------------------------------------

  - source: age_group_18_25
    target: q_age_group
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  - source: diet_vegan
    target: q_diet
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  - source: gender_female
    target: q_gender
    relation: ELICITS_QUESTION
    properties:
      condition: "if_not_known"
      timing: "immediate"

  - source: skin_type_dry
    target: q_skin_type
    relation: ELICITS_QUESTION
    properties:
      condition: "if_problem_includes_dehydration"
      timing: "immediate"

  - source: sun_exposure_minimal
    target: q_sun_exposure
    relation: ELICITS_QUESTION
    properties:
      condition: "if_problem_includes_oxidative_stress"
      timing: "immediate"

  - source: lifestyle_stressful
    target: q_lifestyle_stress
    relation: ELICITS_QUESTION
    properties:
      condition: "if_problem_includes_oxidative_stress"
      timing: "immediate"

  - source: allergy_constraint_fish
    target: q_allergies
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"
      is_safety_critical: true

  - source: allergy_constraint_shellfish
    target: q_allergies
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"
      is_safety_critical: true

  # --------------------------------------------------------------------------
  # INGREDIENT → TREATS → PROBLEM
  # Defines which ingredients are effective for which problems
  # --------------------------------------------------------------------------

  # COLLAGEN for Elasticity & Wrinkles
  - source: collagen_type_1_3_marine
    target: poor_elasticity
    relation: TREATS
    properties:
      mechanism: "Provides bioavailable collagen peptides to restore skin structure and firmness"
      efficacy: 0.90
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  - source: collagen_type_1_3_marine
    target: wrinkles
    relation: TREATS
    properties:
      mechanism: "Stimulates fibroblast collagen production and reduces collagen degradation"
      efficacy: 0.85
      onset_time: "8-12 weeks"
      evidence_level: "clinical_trial"

  - source: collagen_type_1_3_bovine
