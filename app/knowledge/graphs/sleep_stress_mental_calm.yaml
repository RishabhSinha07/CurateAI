# Sleep, Stress & Mental Calm Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on improving sleep quality, reducing stress, managing anxiety, and promoting mental calm.
#
# UPDATING THIS GRAPH:
# 1. Add new nodes under the appropriate section (problems, attributes, etc.)
# 2. Ensure all IDs are unique and use snake_case
# 3. Add edges to connect new nodes to existing ones
# 4. Run validation: python -m app.knowledge.validate sleep_stress_mental_calm
# 5. Reload graph in development: reload_graph('sleep_stress_mental_calm')

metadata:
  domain: sleep_stress_mental_calm
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for sleep optimization, stress management, anxiety reduction, and mental calm"
  display_name: "Sleep, Stress & Mental Calm"
  persona: "You are a sleep and stress management specialist who helps users improve sleep quality, reduce stress and anxiety, and achieve mental calm. You focus on evidence-based natural supplements, sleep hygiene, and stress reduction techniques. You emphasize the interconnection between sleep, stress, and overall health."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Sleep and stress challenges
  # ============================================================================
  problems:
    - id: difficulty_falling_asleep
      name: "difficulty_falling_asleep"
      display_name: "Difficulty Falling Asleep (Sleep Onset Insomnia)"
      synonyms:
        - "can't fall asleep"
        - "trouble falling asleep"
        - "takes hours to fall asleep"
        - "insomnia"
        - "sleep onset problems"
      severity_levels: [mild, moderate, severe]
      description: "Difficulty initiating sleep at bedtime"

    - id: poor_sleep_quality
      name: "poor_sleep_quality"
      display_name: "Poor Sleep Quality"
      synonyms:
        - "restless sleep"
        - "light sleep"
        - "unrefreshing sleep"
        - "wake up tired"
        - "not rested"
      severity_levels: [mild, moderate, severe]
      description: "Low quality, non-restorative sleep"

    - id: night_waking
      name: "night_waking"
      display_name: "Frequent Night Waking (Sleep Maintenance)"
      synonyms:
        - "wake up during night"
        - "can't stay asleep"
        - "middle insomnia"
        - "sleep maintenance insomnia"
      severity_levels: [mild, moderate, severe]
      description: "Waking up multiple times during the night"

    - id: early_morning_waking
      name: "early_morning_waking"
      display_name: "Early Morning Waking"
      synonyms:
        - "wake up too early"
        - "can't sleep past 5am"
        - "terminal insomnia"
      severity_levels: [mild, moderate, severe]
      description: "Waking up too early and unable to return to sleep"

    - id: chronic_stress
      name: "chronic_stress"
      display_name: "Chronic Stress"
      synonyms:
        - "always stressed"
        - "constant stress"
        - "high stress"
        - "can't relax"
      severity_levels: [mild, moderate, severe]
      description: "Prolonged elevated stress levels"

    - id: anxiety
      name: "anxiety"
      display_name: "Anxiety & Worry"
      synonyms:
        - "anxious"
        - "worried"
        - "nervous"
        - "fearful"
        - "panic"
      severity_levels: [mild, moderate, severe]
      description: "Excessive worry, nervousness, or fear"

    - id: racing_thoughts
      name: "racing_thoughts"
      display_name: "Racing Thoughts & Mental Restlessness"
      synonyms:
        - "can't quiet mind"
        - "overthinking"
        - "busy mind"
        - "mental chatter"
      severity_levels: [mild, moderate, severe]
      description: "Rapid, intrusive thoughts preventing relaxation"

    - id: burnout
      name: "burnout"
      display_name: "Burnout & Exhaustion"
      synonyms:
        - "burned out"
        - "exhausted"
        - "depleted"
        - "overwhelmed"
        - "mental fatigue"
      severity_levels: [mild, moderate, severe]
      description: "Physical and emotional exhaustion from prolonged stress"

    - id: restlessness
      name: "restlessness"
      display_name: "Physical Restlessness"
      synonyms:
        - "can't sit still"
        - "fidgety"
        - "agitated"
        - "restless"
      severity_levels: [mild, moderate, severe]
      description: "Physical tension and inability to relax"

  # ============================================================================
  # ATTRIBUTES - User context for personalization
  # ============================================================================
  attributes:
    # Sleep patterns
    - id: sleep_duration
      name: "sleep_duration"
      display_name: "Average Sleep Duration"
      type: categorical
      values:
        - less_than_5_hours
        - 5_6_hours
        - 6_7_hours
        - 7_8_hours
        - more_than_8_hours
      required: true
      description: "Typical hours of sleep per night"

    - id: sleep_schedule
      name: "sleep_schedule"
      display_name: "Sleep Schedule Consistency"
      type: categorical
      values:
        - very_irregular
        - somewhat_irregular
        - mostly_regular
        - very_regular
      required: true
      description: "Consistency of bedtime and wake time"

    - id: bedtime
      name: "bedtime"
      display_name: "Typical Bedtime"
      type: categorical
      values:
        - before_10pm
        - 10pm_11pm
        - 11pm_12am
        - after_12am
      required: false
      description: "Usual time going to bed"

    # Stress and mental state
    - id: stress_level
      name: "stress_level"
      display_name: "Current Stress Level"
      type: categorical
      values:
        - low
        - moderate
        - high
        - very_high
      required: true
      description: "Overall stress levels"

    - id: stress_source
      name: "stress_source"
      display_name: "Primary Stress Source"
      type: categorical
      values:
        - work
        - relationships
        - financial
        - health
        - multiple_sources
      required: false
      description: "Main source of stress"

    - id: anxiety_frequency
      name: "anxiety_frequency"
      display_name: "Anxiety Frequency"
      type: categorical
      values:
        - rarely
        - occasionally
        - frequently
        - daily
      required: false
      description: "How often anxiety occurs"

    # Lifestyle factors
    - id: caffeine_intake
      name: "caffeine_intake"
      display_name: "Daily Caffeine Intake"
      type: categorical
      values:
        - none
        - low  # 1 cup coffee/day
        - moderate  # 2-3 cups
        - high  # 4+ cups
      required: true
      description: "Daily caffeine consumption"

    - id: screen_time_before_bed
      name: "screen_time_before_bed"
      display_name: "Screen Time Before Bed"
      type: categorical
      values:
        - none_1_hour_before
        - minimal
        - moderate
        - extensive  # Using screens until sleep
      required: false
      description: "Device usage before bedtime"

    - id: exercise_timing
      name: "exercise_timing"
      display_name: "Exercise Timing"
      type: categorical
      values:
        - morning
        - afternoon
        - evening
        - night  # Within 2 hours of bed
        - no_exercise
      required: false
      description: "When exercise occurs"

    - id: alcohol_consumption
      name: "alcohol_consumption"
      display_name: "Alcohol Consumption"
      type: categorical
      values:
        - none
        - occasional
        - moderate
        - frequent
      required: false
      description: "Alcohol intake frequency"

    # Demographic
    - id: age_group
      name: "age_group"
      display_name: "Age Group"
      type: categorical
      values:
        - 18_25
        - 26_35
        - 36_45
        - 46_plus
      required: true
      description: "Age range"

    - id: gender
      name: "gender"
      display_name: "Gender"
      type: categorical
      values:
        - female
        - male
        - other
      required: true
      description: "Gender"

    - id: shift_work
      name: "shift_work"
      display_name: "Shift Work Status"
      type: categorical
      values:
        - no_shift_work
        - rotating_shifts
        - night_shift
        - variable_schedule
      required: false
      description: "Work schedule type"

  # ============================================================================
  # INGREDIENTS - Sleep, stress, and calm nutrients
  # ============================================================================
  ingredients:
    # SLEEP HORMONES & REGULATORS
    - id: melatonin
      name: "melatonin"
      display_name: "Melatonin"
      function: "sleep_onset_circadian_regulation"
      category: "hormones"
      strength_levels: ["0.5mg", "1mg", "3mg", "5mg", "10mg"]
      description: "Natural sleep hormone that regulates circadian rhythm"

    # AMINO ACIDS & NEUROTRANSMITTER PRECURSORS
    - id: l_theanine
      name: "l_theanine"
      display_name: "L-Theanine"
      function: "relaxation_without_sedation_alpha_waves"
      category: "amino_acids"
      strength_levels: ["100mg", "200mg", "400mg"]
      description: "Amino acid from tea that promotes calm alertness"

    - id: gaba
      name: "gaba"
      display_name: "GABA (Gamma-Aminobutyric Acid)"
      function: "calming_neurotransmitter_anxiety_reduction"
      category: "amino_acids"
      strength_levels: ["250mg", "500mg", "750mg"]
      description: "Inhibitory neurotransmitter that calms nervous system"

    - id: l_tryptophan
      name: "l_tryptophan"
      display_name: "L-Tryptophan"
      function: "serotonin_melatonin_precursor_sleep"
      category: "amino_acids"
      strength_levels: ["500mg", "1000mg", "1500mg"]
      description: "Precursor to serotonin and melatonin for sleep"

    - id: 5_htp_sleep
      name: "5_htp_sleep"
      display_name: "5-HTP (5-Hydroxytryptophan)"
      function: "serotonin_production_mood_sleep"
      category: "amino_acids"
      strength_levels: ["50mg", "100mg", "200mg"]
      description: "Direct serotonin precursor for mood and sleep"

    - id: glycine
      name: "glycine"
      display_name: "Glycine"
      function: "sleep_quality_body_temperature_regulation"
      category: "amino_acids"
      strength_levels: ["1g", "3g", "5g"]
      description: "Amino acid that improves sleep quality by lowering core temperature"

    # MINERALS
    - id: magnesium_glycinate_sleep
      name: "magnesium_glycinate_sleep"
      display_name: "Magnesium Glycinate"
      function: "muscle_relaxation_gaba_activation_sleep"
      category: "minerals"
      strength_levels: ["200mg", "400mg", "500mg"]
      description: "Most bioavailable magnesium for sleep and relaxation"

    - id: magnesium_threonate
      name: "magnesium_threonate"
      display_name: "Magnesium L-Threonate"
      function: "brain_magnesium_cognitive_calm"
      category: "minerals"
      strength_levels: ["1000mg", "2000mg"]
      description: "Crosses blood-brain barrier for cognitive benefits and calm"

    - id: zinc_sleep
      name: "zinc_sleep"
      display_name: "Zinc"
      function: "neurotransmitter_regulation_sleep_quality"
      category: "minerals"
      strength_levels: ["15mg", "30mg"]
      description: "Supports neurotransmitter function and sleep quality"

    # ADAPTOGENS
    - id: ashwagandha_sleep
      name: "ashwagandha_sleep"
      display_name: "Ashwagandha (KSM-66)"
      function: "cortisol_reduction_stress_sleep_quality"
      category: "adaptogens"
      strength_levels: ["300mg", "600mg"]
      standardization: "5% withanolides"
      description: "Reduces cortisol, improves stress resilience and sleep quality"

    - id: rhodiola_stress
      name: "rhodiola_stress"
      display_name: "Rhodiola Rosea"
      function: "stress_resilience_mental_fatigue"
      category: "adaptogens"
      strength_levels: ["250mg", "500mg"]
      standardization: "3% rosavins"
      description: "Adaptogen for stress, burnout, and mental fatigue"

    - id: holy_basil
      name: "holy_basil"
      display_name: "Holy Basil (Tulsi)"
      function: "stress_adaptation_cortisol_balance"
      category: "adaptogens"
      strength_levels: ["300mg", "600mg"]
      description: "Ayurvedic adaptogen for stress and anxiety"

    - id: reishi_mushroom
      name: "reishi_mushroom"
      display_name: "Reishi Mushroom"
      function: "calm_sleep_immune_support"
      category: "adaptogens"
      strength_levels: ["500mg", "1000mg"]
      description: "Calming mushroom that supports sleep and stress resilience"

    # BOTANICALS
    - id: valerian_root
      name: "valerian_root"
      display_name: "Valerian Root"
      function: "sedative_sleep_onset_gaba_modulation"
      category: "botanicals"
      strength_levels: ["300mg", "600mg"]
      description: "Traditional herb for sleep onset and anxiety"

    - id: passionflower
      name: "passionflower"
      display_name: "Passionflower"
      function: "anxiety_reduction_gaba_enhancement"
      category: "botanicals"
      strength_levels: ["250mg", "500mg"]
      description: "Reduces anxiety and promotes calm sleep"

    - id: chamomile
      name: "chamomile"
      display_name: "Chamomile"
      function: "mild_sedative_relaxation"
      category: "botanicals"
      strength_levels: ["300mg", "500mg"]
      description: "Gentle calming herb for relaxation and sleep"

    - id: lemon_balm
      name: "lemon_balm"
      display_name: "Lemon Balm"
      function: "anxiety_reduction_sleep_quality"
      category: "botanicals"
      strength_levels: ["300mg", "600mg"]
      description: "Calming herb that reduces anxiety and improves sleep"

    - id: lavender
      name: "lavender"
      display_name: "Lavender Extract"
      function: "anxiety_reduction_relaxation"
      category: "botanicals"
      strength_levels: ["80mg", "160mg"]
      standardization: "Silexan"
      description: "Clinically studied for anxiety and sleep quality"

    # VITAMINS
    - id: vitamin_b6_sleep
      name: "vitamin_b6_sleep"
      display_name: "Vitamin B6 (Pyridoxine)"
      function: "serotonin_gaba_synthesis_dream_recall"
      category: "vitamins"
      strength_levels: ["10mg", "50mg", "100mg"]
      description: "Required for neurotransmitter synthesis affecting sleep"

    - id: vitamin_d_sleep
      name: "vitamin_d_sleep"
      display_name: "Vitamin D3"
      function: "sleep_regulation_mood"
      category: "vitamins"
      strength_levels: ["1000IU", "2000IU", "5000IU"]
      description: "Deficiency linked to poor sleep quality"

    - id: b_complex_stress
      name: "b_complex_stress"
      display_name: "B-Complex Vitamins"
      function: "stress_response_neurotransmitter_production"
      category: "vitamins"
      description: "Support stress response and nervous system health"

    # OTHER
    - id: cbd
      name: "cbd"
      display_name: "CBD (Cannabidiol)"
      function: "anxiety_reduction_sleep_quality"
      category: "cannabinoids"
      strength_levels: ["10mg", "25mg", "50mg"]
      description: "Non-psychoactive compound for anxiety and sleep"

    - id: apigenin
      name: "apigenin"
      display_name: "Apigenin"
      function: "gaba_receptor_activation_sedation"
      category: "flavonoids"
      strength_levels: ["50mg", "100mg"]
      description: "Flavonoid from chamomile that binds GABA receptors"

  # ============================================================================
  # CONSTRAINTS - Safety and contraindications
  # ============================================================================
  constraints:
    - id: pregnancy
      name: "pregnancy"
      display_name: "Pregnancy"
      severity: high
      description: "Currently pregnant"

    - id: breastfeeding
      name: "breastfeeding"
      display_name: "Breastfeeding"
      severity: moderate
      description: "Currently breastfeeding"

    - id: depression
      name: "depression"
      display_name: "Clinical Depression"
      severity: high
      description: "Diagnosed depression requiring medical treatment"

    - id: bipolar_disorder
      name: "bipolar_disorder"
      display_name: "Bipolar Disorder"
      severity: high
      description: "Bipolar disorder"

    - id: sleep_medication
      name: "sleep_medication"
      display_name: "Prescription Sleep Medication"
      severity: high
      description: "Currently taking prescription sleep aids"

    - id: anxiety_medication
      name: "anxiety_medication"
      display_name: "Prescription Anxiety Medication"
      severity: high
      description: "Currently taking prescription anti-anxiety medication"

    - id: antidepressants
      name: "antidepressants"
      display_name: "Antidepressant Medication"
      severity: high
      description: "Currently taking antidepressants"

    - id: sedatives
      name: "sedatives"
      display_name: "Sedative Medications"
      severity: high
      description: "Taking sedatives or CNS depressants"

    - id: autoimmune_disease
      name: "autoimmune_disease"
      display_name: "Autoimmune Disease"
      severity: moderate
      description: "Autoimmune condition"

# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  problem_requires_attributes:
    - from: difficulty_falling_asleep
      to: [sleep_schedule, bedtime, caffeine_intake, screen_time_before_bed, stress_level]
      relationship: REQUIRES_KNOWING

    - from: poor_sleep_quality
      to: [sleep_duration, caffeine_intake, alcohol_consumption, stress_level]
      relationship: REQUIRES_KNOWING

    - from: night_waking
      to: [sleep_duration, stress_level, caffeine_intake, age_group]
      relationship: REQUIRES_KNOWING

    - from: chronic_stress
      to: [stress_level, stress_source, sleep_duration, exercise_timing]
      relationship: REQUIRES_KNOWING

    - from: anxiety
      to: [anxiety_frequency, stress_level, caffeine_intake, sleep_duration]
      relationship: REQUIRES_KNOWING

    - from: burnout
      to: [stress_level, stress_source, sleep_duration, work_hours]
      relationship: REQUIRES_KNOWING

  # INGREDIENT → TREATS → PROBLEM
  ingredient_treats_problem:
    # Melatonin for sleep onset
    - from: melatonin
      to: difficulty_falling_asleep
      relationship: TREATS
      efficacy: 0.85
      mechanism: "Signals sleep onset and regulates circadian rhythm"
      evidence_level: "meta_analysis"
      onset: "30-60 minutes"

    - from: melatonin
      to: poor_sleep_quality
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Improves sleep efficiency and total sleep time"
      evidence_level: "clinical_trial"
      onset: "1-2 weeks"

    # Magnesium for sleep and stress
    - from: magnesium_glycinate_sleep
      to: difficulty_falling_asleep
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Activates GABA receptors and promotes muscle relaxation"
      evidence_level: "clinical_trial"
      onset: "1-2 weeks"

    - from: magnesium_glycinate_sleep
      to: poor_sleep_quality
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Improves sleep depth and reduces night waking"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    - from: magnesium_glycinate_sleep
      to: chronic_stress
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Modulates stress response and nervous system function"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    # L-Theanine for calm and focus
    - from: l_theanine
      to: anxiety
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Increases alpha brain waves promoting relaxed alertness"
      evidence_level: "clinical_trial"
      onset: "30-60 minutes"

    - from: l_theanine
      to: racing_thoughts
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Promotes mental calm without sedation"
      evidence_level: "clinical_trial"
      onset: "30-60 minutes"

    - from: l_theanine
      to: chronic_stress
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Reduces cortisol and stress response"
      evidence_level: "clinical_trial"
      onset: "1-2 weeks"

    # GABA for anxiety and sleep
    - from: gaba
      to: anxiety
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Calms nervous system by inhibiting neural activity"
      evidence_level: "clinical_trial"
      onset: "30-60 minutes"

    - from: gaba
      to: restlessness
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Reduces physical and mental agitation"
      evidence_level: "clinical_trial"
      onset: "30-60 minutes"

    # Ashwagandha for stress and sleep
    - from: ashwagandha_sleep
      to: chronic_stress
      relationship: TREATS
      efficacy: 0.85
      mechanism: "Reduces cortisol levels and improves stress resilience"
      evidence_level: "meta_analysis"
      onset: "2-4 weeks"

    - from: ashwagandha_sleep
      to: anxiety
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Adaptogenic properties reduce anxiety symptoms"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    - from: ashwagandha_sleep
      to: poor_sleep_quality
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Improves sleep onset latency and quality"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    - from: ashwagandha_sleep
      to: burnout
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Restores energy and stress resilience"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    # Rhodiola for burnout and stress
    - from: rhodiola_stress
      to: burnout
      relationship: TREATS
      efficacy: 0.85
      mechanism: "Reduces mental fatigue and improves stress resistance"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    - from: rhodiola_stress
      to: chronic_stress
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Adaptogen that normalizes stress response"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    # Valerian for sleep
    - from: valerian_root
      to: difficulty_falling_asleep
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Modulates GABA receptors for sedation"
      evidence_level: "clinical_trial"
      onset: "1-2 weeks"

    - from: valerian_root
      to: anxiety
      relationship: TREATS
      efficacy: 0.70
      mechanism: "GABAergic effects reduce anxiety"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    # Passionflower for anxiety
    - from: passionflower
      to: anxiety
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Enhances GABA activity for calm"
      evidence_level: "clinical_trial"
      onset: "1-2 weeks"

    - from: passionflower
      to: restlessness
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Reduces nervous tension"
      evidence_level: "clinical_trial"
      onset: "1-2 weeks"

    # Lavender for anxiety
    - from: lavender
      to: anxiety
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Silexan preparation clinically proven for anxiety"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    - from: lavender
      to: poor_sleep_quality
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Improves sleep quality and reduces anxiety"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    # Lemon Balm
    - from: lemon_balm
      to: anxiety
      relationship: TREATS
      efficacy: 0.75
      mechanism: "GABA transaminase inhibition increases GABA"
      evidence_level: "clinical_trial"
      onset: "1-2 weeks"

    - from: lemon_balm
      to: racing_thoughts
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Calms mental activity"
      evidence_level: "clinical_trial"
      onset: "1-2 weeks"

    # Reishi for stress and sleep
    - from: reishi_mushroom
      to: chronic_stress
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Adaptogenic properties support stress response"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    - from: reishi_mushroom
      to: poor_sleep_quality
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Promotes deep, restorative sleep"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    # Glycine for sleep quality
    - from: glycine
      to: poor_sleep_quality
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Lowers core body temperature for better sleep"
      evidence_level: "clinical_trial"
      onset: "1-3 days"

  # INGREDIENT → RECOMMENDED_FOR → ATTRIBUTE
  ingredient_recommended_for_attribute:
    - from: melatonin
      to: [shift_work, bedtime:after_12am, sleep_schedule:very_irregular]
      relationship: RECOMMENDED_FOR

    - from: ashwagandha_sleep
      to: [stress_level:high, stress_level:very_high, burnout]
      relationship: RECOMMENDED_FOR

    - from: magnesium_glycinate_sleep
      to: [restlessness, muscle_tension, stress_level:high]
      relationship: RECOMMENDED_FOR

    - from: l_theanine
      to: [anxiety_frequency:frequently, anxiety_frequency:daily, racing_thoughts]
      relationship: RECOMMENDED_FOR

  # INGREDIENT → CONTRAINDICATED_FOR → CONSTRAINT
  ingredient_contraindications:
