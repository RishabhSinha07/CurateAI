metadata:
  domain: sleep_stress_mental_calm
  version: 1.0.0
  created_at: '2026-01-31'
  description: Knowledge graph for sleep optimization, stress management, anxiety
    reduction, and mental calm
  display_name: Sleep, Stress & Mental Calm
  persona: You are a sleep and stress management specialist who helps users improve
    sleep quality, reduce stress and anxiety, and achieve mental calm. You focus on
    evidence-based natural supplements, sleep hygiene, and stress reduction techniques.
    You emphasize the interconnection between sleep, stress, and overall health.
  is_active: true
  parent_domain: null
nodes:
  problems:
  - id: difficulty_falling_asleep
    name: difficulty_falling_asleep
    display_name: Difficulty Falling Asleep (Sleep Onset Insomnia)
    synonyms:
    - can't fall asleep
    - trouble falling asleep
    - takes hours to fall asleep
    - insomnia
    - sleep onset problems
    severity_levels:
    - mild
    - moderate
    - severe
    description: Difficulty initiating sleep at bedtime
  - id: poor_sleep_quality
    name: poor_sleep_quality
    display_name: Poor Sleep Quality
    synonyms:
    - restless sleep
    - light sleep
    - unrefreshing sleep
    - wake up tired
    - not rested
    severity_levels:
    - mild
    - moderate
    - severe
    description: Low quality, non-restorative sleep
  - id: night_waking
    name: night_waking
    display_name: Frequent Night Waking (Sleep Maintenance)
    synonyms:
    - wake up during night
    - can't stay asleep
    - middle insomnia
    - sleep maintenance insomnia
    severity_levels:
    - mild
    - moderate
    - severe
    description: Waking up multiple times during the night
  - id: early_morning_waking
    name: early_morning_waking
    display_name: Early Morning Waking
    synonyms:
    - wake up too early
    - can't sleep past 5am
    - terminal insomnia
    severity_levels:
    - mild
    - moderate
    - severe
    description: Waking up too early and unable to return to sleep
  - id: chronic_stress
    name: chronic_stress
    display_name: Chronic Stress
    synonyms:
    - always stressed
    - constant stress
    - high stress
    - can't relax
    severity_levels:
    - mild
    - moderate
    - severe
    description: Prolonged elevated stress levels
  - id: anxiety
    name: anxiety
    display_name: Anxiety & Worry
    synonyms:
    - anxious
    - worried
    - nervous
    - fearful
    - panic
    severity_levels:
    - mild
    - moderate
    - severe
    description: Excessive worry, nervousness, or fear
  - id: racing_thoughts
    name: racing_thoughts
    display_name: Racing Thoughts & Mental Restlessness
    synonyms:
    - can't quiet mind
    - overthinking
    - busy mind
    - mental chatter
    severity_levels:
    - mild
    - moderate
    - severe
    description: Rapid, intrusive thoughts preventing relaxation
  - id: burnout
    name: burnout
    display_name: Burnout & Exhaustion
    synonyms:
    - burned out
    - exhausted
    - depleted
    - overwhelmed
    - mental fatigue
    severity_levels:
    - mild
    - moderate
    - severe
    description: Physical and emotional exhaustion from prolonged stress
  - id: restlessness
    name: restlessness
    display_name: Physical Restlessness
    synonyms:
    - can't sit still
    - fidgety
    - agitated
    - restless
    severity_levels:
    - mild
    - moderate
    - severe
    description: Physical tension and inability to relax
