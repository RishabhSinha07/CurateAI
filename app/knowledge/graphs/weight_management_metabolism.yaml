metadata:
  domain: weight_management_metabolism
  version: 1.0.0
  created_at: '2026-01-31'
  description: Knowledge graph for weight management, fat loss, appetite control,
    and metabolic health
  display_name: Weight Management & Metabolism
  persona: You are a weight management and metabolism specialist who helps users achieve
    healthy weight loss, optimize metabolic function, and maintain sustainable results.
    You focus on evidence-based nutrition, appetite regulation, fat burning nutrients,
    and lifestyle factors. You emphasize safe, gradual weight loss and metabolic health
    over quick fixes.
  is_active: true
  parent_domain: null
nodes:
  problems:
  - id: difficulty_losing_weight
    name: difficulty_losing_weight
    display_name: Difficulty Losing Weight
    synonyms:
    - can't lose weight
    - weight loss plateau
    - stuck at same weight
    - not losing weight
    - weight won't budge
    severity_levels:
    - mild
    - moderate
    - severe
    description: Inability to lose weight despite diet and exercise efforts
  - id: slow_metabolism
    name: slow_metabolism
    display_name: Slow Metabolism
    synonyms:
    - sluggish metabolism
    - low metabolic rate
    - slow fat burning
    - metabolic slowdown
    severity_levels:
    - mild
    - moderate
    - severe
    description: Reduced metabolic rate leading to weight gain or difficulty losing
      weight
  - id: excess_body_fat
    name: excess_body_fat
    display_name: Excess Body Fat
    synonyms:
    - high body fat
    - too much fat
    - overweight
    - obesity
    severity_levels:
    - mild
    - moderate
    - severe
    description: Elevated body fat percentage above healthy ranges
  - id: uncontrolled_appetite
    name: uncontrolled_appetite
    display_name: Uncontrolled Appetite & Cravings
    synonyms:
    - always hungry
    - can't control cravings
    - constant hunger
    - food cravings
    - overeating
    severity_levels:
    - mild
    - moderate
    - severe
    description: Difficulty controlling appetite and food cravings
  - id: emotional_eating
    name: emotional_eating
    display_name: Emotional Eating
    synonyms:
    - stress eating
    - eating due to emotions
    - comfort eating
    - binge eating
    severity_levels:
    - mild
    - moderate
    - severe
    description: Eating in response to emotions rather than hunger
  - id: stubborn_belly_fat
    name: stubborn_belly_fat
    display_name: Stubborn Belly Fat
    synonyms:
    - belly fat
    - abdominal fat
    - visceral fat
    - midsection fat
    severity_levels:
    - mild
    - moderate
    - severe
    description: Excess fat accumulation in the abdominal area
  - id: blood_sugar_imbalance
    name: blood_sugar_imbalance
    display_name: Blood Sugar Imbalance
    synonyms:
    - blood sugar spikes
    - insulin resistance
    - sugar crashes
    - unstable blood sugar
    severity_levels:
    - mild
    - moderate
    - severe
    description: Poor blood glucose control affecting weight and energy
  - id: low_energy_weight_loss
    name: low_energy_weight_loss
    display_name: Low Energy During Weight Loss
    synonyms:
    - tired on diet
    - no energy while dieting
    - fatigue from calorie deficit
    severity_levels:
    - mild
    - moderate
    - severe
    description: Reduced energy levels when trying to lose weight
  - id: post_weight_loss_regain
    name: post_weight_loss_regain
    display_name: Weight Regain After Loss
    synonyms:
    - yo-yo dieting
    - weight cycling
    - regaining weight
    - can't maintain weight loss
    severity_levels:
    - mild
    - moderate
    - severe
    description: Difficulty maintaining weight loss and tendency to regain
