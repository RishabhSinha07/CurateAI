metadata:
  domain: hormonal_balance
  version: 1.0.0
  created_at: '2026-01-31'
  description: Support for hormone regulation across life stages including PCOS, PMS, and menopause
  display_name: Hormonal Balance
  persona: You are a hormonal health specialist who helps users find science-backed nutraceutical supplements for hormone
    balance, PCOS, PMS, menopause, and reproductive health. You focus on adaptogens, hormone-modulating herbs, and micronutrients.
  is_active: true
  parent_domain: null
nodes:
  problems:
  - id: pcos
    name: pcos
    display_name: PCOS (Polycystic Ovary Syndrome)
    synonyms:
    - irregular periods
    - acne
    - hirsutism
    - weight gain
    - insulin resistance
    severity_levels:
    - mild
    - moderate
    - severe
    description: Hormonal disorder causing irregular periods, insulin resistance, and elevated androgens
  - id: pms_symptoms
    name: pms_symptoms
    display_name: PMS (Premenstrual Syndrome)
    synonyms:
    - mood swings
    - bloating
    - breast tenderness
    - cramps
    - fatigue
    - irritability
    severity_levels:
    - mild
    - moderate
    - severe
    description: Physical and emotional symptoms before menstruation
  - id: menopause_symptoms
    name: menopause_symptoms
    display_name: Menopause Symptoms
    synonyms:
    - hot flashes
    - night sweats
    - mood swings
    - sleep disturbance
    - vaginal dryness
    severity_levels:
    - mild
    - moderate
    - severe
    description: Hot flashes, night sweats, mood changes during menopause transition
  - id: irregular_periods
    name: irregular_periods
    display_name: Irregular Menstrual Cycles
    synonyms:
    - missed periods
    - heavy bleeding
    - spotting
    - cycle length variation
    severity_levels:
    - mild
    - moderate
    - severe
    description: Unpredictable period timing, heavy or light flow
  - id: hormonal_acne
    name: hormonal_acne
    display_name: Hormonal Acne
    synonyms:
    - cystic acne
    - jawline breakouts
    - premenstrual acne
    - adult acne
    severity_levels:
    - mild
    - moderate
    - severe
    description: Acne driven by hormonal fluctuations, especially around jawline and chin
  - id: low_libido
    name: low_libido
    display_name: Low Sex Drive
    synonyms:
    - decreased libido
    - low arousal
    - sexual dysfunction
    severity_levels:
    - mild
    - moderate
    - severe
    description: Reduced sexual desire often linked to hormonal imbalance
  - id: estrogen_dominance
    name: estrogen_dominance
    display_name: Estrogen Dominance
    synonyms:
    - heavy periods
    - breast tenderness
    - mood swings
    - weight gain
    - fibroids
    severity_levels:
    - mild
    - moderate
    - severe
    description: Excess estrogen relative to progesterone causing various symptoms
  - id: thyroid_imbalance
    name: thyroid_imbalance
    display_name: Thyroid Dysfunction
    synonyms:
    - fatigue
    - weight changes
    - hair loss
    - cold intolerance
    - brain fog
    severity_levels:
    - mild
    - moderate
    - severe
    description: Hypothyroid or hyperthyroid symptoms affecting metabolism and energy
  - id: fertility_issues
    name: fertility_issues
    display_name: Fertility Challenges
    synonyms:
    - anovulation
    - luteal phase defect
    - poor egg quality
    - implantation failure
    severity_levels:
    - mild
    - moderate
    - severe
    description: Difficulty conceiving related to hormonal imbalances
