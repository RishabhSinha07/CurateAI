    synonyms:
    - decreased energy
    - slower recovery
    - reduced vitality
    - age-related decline
    severity_levels:
    - mild
    - moderate
    - severe
    description: Accumulation of senescent cells and cellular damage
  - id: oxidative_stress_aging
