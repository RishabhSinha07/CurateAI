    display_name: Chronic Inflammation (Inflammaging)
    synonyms:
    - joint pain
    - fatigue
    - brain fog
    - metabolic issues
    - increased disease risk
    severity_levels:
    - mild
    - moderate
    - severe
    description: Low-grade systemic inflammation that accelerates aging
  - id: cellular_aging
