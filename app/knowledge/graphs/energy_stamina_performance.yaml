# Energy, Stamina & Performance Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on increasing energy, reducing fatigue, and enhancing physical/mental performance.
#
# UPDATING THIS GRAPH:
# 1. Add new nodes under the appropriate section (problems, attributes, etc.)
# 2. Ensure all IDs are unique and use snake_case
# 3. Add edges to connect new nodes to existing ones
# 4. Run validation: python -m app.knowledge.validate energy_stamina_performance
# 5. Reload graph in development: reload_graph('energy_stamina_performance')

metadata:
  domain: energy_stamina_performance
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for energy, stamina & performance nutraceutical recommendations"
  display_name: "Energy, Stamina & Performance"
  persona: "You are an energy and performance nutrition specialist who helps users find science-backed nutraceutical supplements for increasing energy levels, reducing fatigue, and enhancing physical and mental performance. You focus on protein, amino acids, minerals, adaptogens, and performance-enhancing nutrients. You consider activity levels, fitness goals, dietary patterns, and lifestyle factors to provide personalized recommendations."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Consumer energy and performance concerns
  # ============================================================================
  problems:
    - id: chronic_fatigue
      name: "chronic_fatigue"
      display_name: "Chronic Fatigue & Low Energy"
      synonyms:
        - "always tired"
        - "constant fatigue"
        - "no energy"
        - "exhausted"
        - "chronic tiredness"
        - "low energy levels"
        - "feeling drained"
      severity_levels: [mild, moderate, severe]
      description: "Persistent lack of energy and feeling of tiredness throughout the day"

    - id: afternoon_slump
      name: "afternoon_slump"
      display_name: "Afternoon Energy Crash"
      synonyms:
        - "post-lunch fatigue"
        - "afternoon crash"
        - "energy dip"
        - "midday tiredness"
        - "2pm slump"
      severity_levels: [mild, moderate, severe]
      description: "Significant energy drop in the afternoon, typically after lunch"

    - id: low_stamina
      name: "low_stamina"
      display_name: "Low Physical Stamina & Endurance"
      synonyms:
        - "poor endurance"
        - "get tired quickly"
        - "can't keep up"
        - "low endurance"
        - "poor stamina"
        - "tired during exercise"
      severity_levels: [mild, moderate, severe]
      description: "Inability to sustain physical activity for extended periods"

    - id: muscle_fatigue
      name: "muscle_fatigue"
      display_name: "Muscle Fatigue & Weakness"
      synonyms:
        - "weak muscles"
        - "muscle exhaustion"
        - "tired muscles"
        - "muscle weakness"
        - "heavy legs"
      severity_levels: [mild, moderate, severe]
      description: "Rapid onset of muscle tiredness during physical activity"

    - id: slow_recovery
      name: "slow_recovery"
      display_name: "Slow Post-Exercise Recovery"
      synonyms:
        - "delayed recovery"
        - "sore for days"
        - "slow muscle recovery"
        - "prolonged fatigue after workout"
        - "DOMS"
      severity_levels: [mild, moderate, severe]
      description: "Extended time needed to recover after physical exertion"

    - id: mental_fatigue
      name: "mental_fatigue"
      display_name: "Mental Fatigue & Brain Fog"
      synonyms:
        - "brain fog"
        - "mental exhaustion"
        - "can't focus"
        - "cognitive fatigue"
        - "mental tiredness"
        - "poor concentration"
      severity_levels: [mild, moderate, severe]
      description: "Reduced mental clarity, focus, and cognitive performance"

    - id: poor_workout_performance
      name: "poor_workout_performance"
      display_name: "Poor Workout Performance"
      synonyms:
        - "weak workouts"
        - "can't lift as much"
        - "plateau"
        - "no strength gains"
        - "declining performance"
      severity_levels: [mild, moderate, severe]
      description: "Inability to perform at desired level during exercise or training"

    - id: inadequate_protein_intake
      name: "inadequate_protein_intake"
      display_name: "Inadequate Protein Intake"
      synonyms:
        - "not enough protein"
        - "protein deficiency"
        - "low protein diet"
        - "insufficient protein"
      severity_levels: [mild, moderate, severe]
      description: "Insufficient dietary protein for activity level and goals"

    - id: low_motivation_energy
      name: "low_motivation_energy"
      display_name: "Low Motivation & Drive"
      synonyms:
        - "no motivation"
        - "lack of drive"
        - "can't get started"
        - "low willpower"
        - "unmotivated"
      severity_levels: [mild, moderate, severe]
      description: "Lack of mental energy and motivation to initiate activities"

