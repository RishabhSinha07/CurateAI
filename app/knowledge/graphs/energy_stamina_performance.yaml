  # ============================================================================
  # QUESTIONS - Templates for eliciting information
  # ============================================================================
  questions:
    - id: q_primary_energy_concern
      text: "What is your primary energy or performance concern?"
      response_type: "single_choice"
      options:
        - "Chronic fatigue/low energy"
        - "Afternoon energy crash"
        - "Low stamina/endurance"
        - "Muscle fatigue"
        - "Slow recovery after workouts"
        - "Mental fatigue/brain fog"
        - "Poor workout performance"
        - "General energy boost"

    - id: q_activity_level
      text: "How would you describe your activity level?"
      response_type: "single_choice"
      options:
        - "Sedentary (desk job, little exercise)"
        - "Lightly active (1-2 workouts/week)"
        - "Moderately active (3-4 workouts/week)"
        - "Very active (5-6 workouts/week)"
        - "Athlete (training daily, competitive)"

    - id: q_fitness_goal
      text: "What is your primary fitness goal?"
      response_type: "single_choice"
      options:
        - "General fitness/health"
        - "Weight loss/fat loss"
        - "Muscle building/gain"
        - "Endurance/stamina"
        - "Strength/power"

    - id: q_age_group
      text: "What is your age group?"
      response_type: "single_choice"
      options:
        - "18-25"
        - "26-35"
        - "36-45"
        - "46+"

    - id: q_gender
      text: "What is your gender?"
      response_type: "single_choice"
      options:
        - "Female"
        - "Male"
        - "Prefer not to say"

    - id: q_diet
      text: "What is your dietary preference?"
      response_type: "single_choice"
      options:
        - "Vegetarian"
        - "Vegan"
        - "Pescatarian"
        - "Non-vegetarian"

    - id: q_sleep_quality
      text: "How would you describe your sleep quality?"
      response_type: "single_choice"
      options:
        - "Poor (less than 6 hours or restless)"
        - "Adequate (6-7 hours)"
        - "Excellent (7-8+ hours, restful)"

    - id: q_stress_level
      text: "How would you describe your stress levels?"
      response_type: "single_choice"
      options:
        - "High stress/demanding lifestyle"
        - "Moderate stress"
        - "Low stress/relaxed"

    - id: q_meal_timing
      text: "How would you describe your eating pattern?"
      response_type: "single_choice"
      options:
        - "Regular meals (3+ meals daily)"
        - "Irregular timing"
        - "Skip meals often"

    - id: q_allergies
      text: "Do you have any of these allergies?"
      response_type: "multi_choice"
      options:
        - "Dairy allergy"
        - "Soy allergy"
        - "Gluten allergy"
        - "No allergies"
      validation_rules:
        allow_none: true

# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # --------------------------------------------------------------------------
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  # --------------------------------------------------------------------------

  # Chronic Fatigue
  - source: chronic_fatigue
    target: sleep_poor
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Poor sleep is a primary cause of chronic fatigue"

  - source: chronic_fatigue
    target: activity_sedentary
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Activity level determines if fatigue is from overexertion or inactivity"

  - source: chronic_fatigue
    target: meal_timing_skip_meals
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Irregular eating patterns contribute to energy crashes"

  # Low Stamina
  - source: low_stamina
    target: activity_very_active
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Current activity level determines baseline and supplement needs"

  - source: low_stamina
    target: goal_endurance
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Fitness goal determines type of stamina support needed"

  # Muscle Fatigue
  - source: muscle_fatigue
    target: activity_moderately_active
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Training intensity affects muscle fatigue and recovery needs"

  - source: muscle_fatigue
    target: goal_muscle_building
    relation: REQUIRES_KNOWING
    properties:
      priority: 2
      is_optional: true
      reason: "Muscle building goals require specific recovery support"

  # Slow Recovery
  - source: slow_recovery
    target: activity_very_active
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Higher activity requires more recovery support"

  - source: slow_recovery
    target: sleep_poor
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Sleep is critical for muscle recovery"

  # Poor Workout Performance
  - source: poor_workout_performance
    target: goal_strength
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Specific goal determines performance enhancement strategy"

  - source: poor_workout_performance
    target: activity_very_active
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Training frequency affects supplement recommendations"

  # Inadequate Protein
  - source: inadequate_protein_intake
    target: diet_vegan
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Dietary preference determines protein source options"

  - source: inadequate_protein_intake
    target: goal_muscle_building
    relation: REQUIRES_KNOWING
    properties:
      priority: 1
      is_optional: false
      reason: "Protein needs vary significantly by fitness goal"

  # --------------------------------------------------------------------------
  # ATTRIBUTE → ELICITS_QUESTION → QUESTION
  # --------------------------------------------------------------------------

  - source: activity_sedentary
    target: q_activity_level
    relation: ELICITS_QUESTION
    properties:
      condition: "always"
      timing: "immediate"

  - source: goal_general_fitness
    target: q_fitness_goal
    relation: ELICITS_QUESTION
    properties:
      condition: "if_active"
      timing: "immediate"

