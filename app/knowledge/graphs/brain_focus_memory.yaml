      to: blood_thinners
      relationship: CONTRAINDICATED_FOR
      severity: caution

    - from: caffeine_focus
      to: anxiety_disorder
      relationship: CONTRAINDICATED_FOR
      severity: caution

    - from: caffeine_focus
      to: high_blood_pressure
      relationship: CONTRAINDICATED_FOR
      severity: caution

  # PROBLEM → SIMILAR_TO → PROBLEM
  problem_similarities:
    - from: brain_fog
      to: lack_mental_clarity
      relationship: SIMILAR_TO

    - from: poor_concentration
      to: mental_fatigue
      relationship: SIMILAR_TO

  # PROBLEM → OFTEN_PAIRED_WITH → PROBLEM
  problem_co_occurrence:
    - from: brain_fog
