# Brain, Focus & Memory Knowledge Graph
#
# This graph defines the domain knowledge for nutraceutical product recommendations
# focused on cognitive function, mental clarity, focus, concentration, and memory.

metadata:
  domain: brain_focus_memory
  version: 1.0.0
  created_at: "2026-01-31"
  description: "Knowledge graph for cognitive enhancement, focus, memory, and mental clarity"
  display_name: "Brain, Focus & Memory"
  persona: "You are a cognitive health specialist who helps users optimize brain function, improve focus and concentration, enhance memory, and maintain mental clarity. You focus on evidence-based nootropics, brain-supporting nutrients, and cognitive enhancers."
  is_active: true
  parent_domain: null

nodes:
  # ============================================================================
  # PROBLEMS - Cognitive and mental performance challenges
  # ============================================================================
  problems:
    - id: brain_fog
      name: "brain_fog"
      display_name: "Brain Fog & Mental Cloudiness"
      synonyms:
        - "foggy brain"
        - "cloudy thinking"
        - "mental fog"
        - "unclear thinking"
        - "fuzzy head"
      severity_levels: [mild, moderate, severe]
      description: "Lack of mental clarity and difficulty thinking clearly"

    - id: poor_concentration
      name: "poor_concentration"
      display_name: "Poor Concentration & Focus"
      synonyms:
        - "can't focus"
        - "easily distracted"
        - "short attention span"
        - "difficulty concentrating"
        - "unable to focus"
      severity_levels: [mild, moderate, severe]
      description: "Difficulty maintaining focus and attention on tasks"

    - id: memory_problems
      name: "memory_problems"
      display_name: "Memory Problems & Forgetfulness"
      synonyms:
        - "forgetful"
        - "poor memory"
        - "can't remember"
        - "memory loss"
        - "forgetting things"
      severity_levels: [mild, moderate, severe]
      description: "Difficulty with short-term or long-term memory recall"

    - id: mental_fatigue
      name: "mental_fatigue"
      display_name: "Mental Fatigue & Cognitive Exhaustion"
      synonyms:
        - "mental exhaustion"
        - "brain tired"
        - "cognitive fatigue"
        - "mentally drained"
      severity_levels: [mild, moderate, severe]
      description: "Reduced mental energy and cognitive endurance"

    - id: slow_processing
      name: "slow_processing"
      display_name: "Slow Mental Processing"
      synonyms:
        - "slow thinking"
        - "takes time to process"
        - "sluggish mind"
        - "slow cognitive speed"
      severity_levels: [mild, moderate, severe]
      description: "Reduced speed of cognitive processing and decision-making"

    - id: learning_difficulties
      name: "learning_difficulties"
      display_name: "Learning & Information Retention Difficulties"
      synonyms:
        - "hard to learn"
        - "can't retain information"
        - "difficulty learning new things"
        - "poor information retention"
      severity_levels: [mild, moderate, severe]
      description: "Challenges with acquiring and retaining new information"

    - id: age_related_decline
      name: "age_related_decline"
      display_name: "Age-Related Cognitive Decline"
      synonyms:
        - "cognitive aging"
        - "mental decline with age"
        - "age-related memory loss"
      severity_levels: [mild, moderate, severe]
      description: "Gradual decline in cognitive function with aging"

    - id: lack_mental_clarity
      name: "lack_mental_clarity"
      display_name: "Lack of Mental Clarity"
      synonyms:
        - "unclear mind"
        - "confused thinking"
        - "mental confusion"
        - "lack of clarity"
      severity_levels: [mild, moderate, severe]
      description: "Difficulty with clear, organized thinking"

    - id: verbal_fluency_issues
      name: "verbal_fluency_issues"
      display_name: "Poor Verbal Fluency & Word Recall"
      synonyms:
        - "word finding difficulty"
        - "tip of tongue"
        - "can't find words"
        - "poor verbal recall"
      severity_levels: [mild, moderate, severe]
      description: "Difficulty finding and recalling words during speech"

  # ============================================================================
  # ATTRIBUTES - User context for personalization
  # ============================================================================
  attributes:
    # Cognitive patterns
    - id: cognitive_demand
      name: "cognitive_demand"
      display_name: "Daily Cognitive Demand"
      type: categorical
      values:
        - low
        - moderate
        - high
        - very_high
      required: true
      description: "Mental workload and cognitive requirements"

    - id: work_type
      name: "work_type"
      display_name: "Type of Work"
      type: categorical
      values:
        - physical_labor
        - routine_tasks
        - knowledge_work
        - creative_work
        - student
      required: false
      description: "Nature of work or study"

    - id: screen_time_hours
      name: "screen_time_hours"
      display_name: "Daily Screen Time"
      type: categorical
      values:
        - less_than_4
        - 4_6_hours
        - 6_8_hours
        - more_than_8
      required: false
      description: "Hours per day using screens"

    # Lifestyle factors
    - id: sleep_quality
      name: "sleep_quality"
      display_name: "Sleep Quality"
      type: categorical
      values:
        - poor
        - fair
        - good
        - excellent
      required: true
      description: "Overall sleep quality"

    - id: stress_level
      name: "stress_level"
      display_name: "Stress Level"
      type: categorical
      values:
        - low
        - moderate
        - high
        - very_high
      required: true
      description: "Current stress levels"

    - id: caffeine_intake
      name: "caffeine_intake"
      display_name: "Daily Caffeine Intake"
      type: categorical
      values:
        - none
        - low
        - moderate
        - high
      required: true
      description: "Daily caffeine consumption"

    - id: exercise_frequency
      name: "exercise_frequency"
      display_name: "Exercise Frequency"
      type: categorical
      values:
        - none
        - 1_2_days
        - 3_4_days
        - 5_plus_days
      required: false
      description: "Weekly exercise sessions"

    # Demographic
    - id: age_group
      name: "age_group"
      display_name: "Age Group"
      type: categorical
      values:
        - 18_25
        - 26_35
        - 36_45
        - 46_60
        - 60_plus
      required: true
      description: "Age range"

    - id: gender
      name: "gender"
      display_name: "Gender"
      type: categorical
      values:
        - female
        - male
        - other
      required: true
      description: "Gender"

  # ============================================================================
  # INGREDIENTS - Cognitive and brain-supporting nutrients
  # ============================================================================
  ingredients:
    # OMEGA-3 FATTY ACIDS
    - id: omega_3_dha
      name: "omega_3_dha"
      display_name: "Omega-3 DHA"
      function: "brain_structure_cognitive_function"
      category: "fatty_acids"
      strength_levels: ["500mg", "1000mg", "2000mg"]
      description: "Primary structural fat in brain for cognitive function"

    - id: omega_3_epa
      name: "omega_3_epa"
      display_name: "Omega-3 EPA"
      function: "brain_inflammation_mood"
      category: "fatty_acids"
      strength_levels: ["500mg", "1000mg", "1500mg"]
      description: "Anti-inflammatory omega-3 supporting brain health"

    # NOOTROPICS & COGNITIVE ENHANCERS
    - id: lions_mane
      name: "lions_mane"
      display_name: "Lion's Mane Mushroom"
      function: "nerve_growth_factor_cognitive_enhancement"
      category: "nootropics"
      strength_levels: ["500mg", "1000mg", "1500mg"]
      description: "Promotes NGF production for brain cell growth and repair"

    - id: bacopa_monnieri
      name: "bacopa_monnieri"
      display_name: "Bacopa Monnieri"
      function: "memory_learning_information_processing"
      category: "nootropics"
      strength_levels: ["300mg", "600mg"]
      standardization: "50% bacosides"
      description: "Ayurvedic herb for memory and cognitive processing"

    - id: ginkgo_biloba
      name: "ginkgo_biloba"
      display_name: "Ginkgo Biloba"
      function: "cerebral_blood_flow_memory"
      category: "nootropics"
      strength_levels: ["120mg", "240mg"]
      standardization: "24% flavone glycosides"
      description: "Increases brain blood flow and oxygen for cognitive function"

    - id: phosphatidylserine
      name: "phosphatidylserine"
      display_name: "Phosphatidylserine (PS)"
      function: "cell_membrane_cognitive_function_memory"
      category: "nootropics"
      strength_levels: ["100mg", "200mg", "300mg"]
      description: "Phospholipid critical for brain cell membrane integrity"

    - id: citicoline
      name: "citicoline"
      display_name: "Citicoline (CDP-Choline)"
      function: "acetylcholine_synthesis_focus_memory"
      category: "nootropics"
      strength_levels: ["250mg", "500mg", "1000mg"]
      description: "Precursor to acetylcholine for focus and memory"

    - id: alpha_gpc
      name: "alpha_gpc"
      display_name: "Alpha-GPC"
      function: "acetylcholine_production_cognitive_performance"
      category: "nootropics"
      strength_levels: ["300mg", "600mg"]
      description: "Choline source that crosses blood-brain barrier"

    # AMINO ACIDS
    - id: l_theanine_focus
      name: "l_theanine_focus"
      display_name: "L-Theanine"
      function: "calm_focus_alpha_waves_attention"
      category: "amino_acids"
      strength_levels: ["100mg", "200mg", "400mg"]
      description: "Promotes relaxed alertness and focused attention"

    - id: l_tyrosine
      name: "l_tyrosine"
      display_name: "L-Tyrosine"
      function: "dopamine_production_cognitive_performance_stress"
      category: "amino_acids"
      strength_levels: ["500mg", "1000mg", "1500mg"]
      description: "Precursor to dopamine for focus under stress"

    - id: acetyl_l_carnitine_brain
      name: "acetyl_l_carnitine_brain"
      display_name: "Acetyl-L-Carnitine (ALCAR)"
      function: "brain_energy_neuroprotection"
      category: "amino_acids"
      strength_levels: ["500mg", "1000mg", "1500mg"]
      description: "Supports brain energy production and neuroprotection"

    # CAFFEINE & SYNERGISTIC COMPOUNDS
    - id: caffeine_focus
      name: "caffeine_focus"
      display_name: "Caffeine"
      function: "alertness_focus_mental_energy"
      category: "stimulants"
      strength_levels: ["50mg", "100mg", "200mg"]
      description: "Increases alertness, focus, and cognitive performance"

    - id: caffeine_theanine_stack
      name: "caffeine_theanine_stack"
      display_name: "Caffeine + L-Theanine Stack"
      function: "calm_focused_energy_no_jitters"
      category: "stacks"
      ratio: "2:1 or 1:1 caffeine:theanine"
      description: "Synergistic combination for smooth focused energy"

    # VITAMINS
    - id: b_complex_brain
      name: "b_complex_brain"
      display_name: "B-Complex Vitamins"
      function: "neurotransmitter_synthesis_brain_energy"
      category: "vitamins"
      components: ["B1", "B2", "B3", "B5", "B6", "B9", "B12"]
      description: "Essential for neurotransmitter production and brain energy"

    - id: vitamin_b12_brain
      name: "vitamin_b12_brain"
      display_name: "Vitamin B12 (Methylcobalamin)"
      function: "myelin_production_cognitive_function"
      category: "vitamins"
      strength_levels: ["500mcg", "1000mcg", "2500mcg"]
      description: "Critical for nerve function and cognitive health"

    - id: vitamin_b6_brain
      name: "vitamin_b6_brain"
      display_name: "Vitamin B6 (P5P)"
      function: "neurotransmitter_synthesis"
      category: "vitamins"
      strength_levels: ["10mg", "50mg", "100mg"]
      description: "Required for dopamine, serotonin, and GABA synthesis"

    - id: folate_brain
      name: "folate_brain"
      display_name: "Folate (Methylfolate)"
      function: "homocysteine_metabolism_brain_health"
      category: "vitamins"
      strength_levels: ["400mcg", "800mcg", "1000mcg"]
      description: "Methylated folate for brain health and methylation"

    - id: vitamin_d_brain
      name: "vitamin_d_brain"
      display_name: "Vitamin D3"
      function: "neuroprotection_cognitive_function"
      category: "vitamins"
      strength_levels: ["1000IU", "2000IU", "5000IU"]
      description: "Neuroprotective and supports cognitive function"

    # MINERALS
    - id: magnesium_brain
      name: "magnesium_brain"
      display_name: "Magnesium L-Threonate"
      function: "brain_magnesium_cognitive_function"
      category: "minerals"
      strength_levels: ["1000mg", "2000mg"]
      description: "Only magnesium that significantly increases brain magnesium"

    - id: zinc_brain
      name: "zinc_brain"
      display_name: "Zinc"
      function: "neurotransmitter_function_memory"
      category: "minerals"
      strength_levels: ["15mg", "30mg"]
      description: "Essential for neurotransmitter function and memory"

    - id: iron_brain
      name: "iron_brain"
      display_name: "Iron"
      function: "oxygen_delivery_cognitive_function"
      category: "minerals"
      strength_levels: ["18mg", "27mg"]
      description: "Prevents cognitive impairment from iron deficiency"

    # ANTIOXIDANTS
    - id: curcumin_brain
      name: "curcumin_brain"
      display_name: "Curcumin"
      function: "neuroprotection_anti_inflammatory"
      category: "antioxidants"
      strength_levels: ["500mg", "1000mg"]
      description: "Anti-inflammatory neuroprotection"

    - id: resveratrol
      name: "resveratrol"
      display_name: "Resveratrol"
      function: "neuroprotection_cerebral_blood_flow"
      category: "antioxidants"
      strength_levels: ["100mg", "250mg", "500mg"]
      description: "Antioxidant supporting brain health and blood flow"

    - id: coq10_brain
      name: "coq10_brain"
      display_name: "CoQ10"
      function: "mitochondrial_energy_neuroprotection"
      category: "antioxidants"
      strength_levels: ["100mg", "200mg", "400mg"]
      description: "Supports brain cell energy production"

    # ADAPTOGENS
    - id: rhodiola_cognitive
      name: "rhodiola_cognitive"
      display_name: "Rhodiola Rosea"
      function: "mental_fatigue_cognitive_performance"
      category: "adaptogens"
      strength_levels: ["250mg", "500mg"]
      description: "Reduces mental fatigue and improves cognitive performance"

    - id: ashwagandha_cognitive
      name: "ashwagandha_cognitive"
      display_name: "Ashwagandha"
      function: "stress_reduction_memory_cognitive_function"
      category: "adaptogens"
      strength_levels: ["300mg", "600mg"]
      description: "Reduces stress-related cognitive impairment"

    - id: ginseng
      name: "ginseng"
      display_name: "Panax Ginseng"
      function: "mental_performance_fatigue_reduction"
      category: "adaptogens"
      strength_levels: ["200mg", "400mg"]
      description: "Enhances mental performance and reduces fatigue"

  # ============================================================================
  # CONSTRAINTS - Safety and contraindications
  # ============================================================================
  constraints:
    - id: pregnancy
      name: "pregnancy"
      display_name: "Pregnancy"
      severity: high
      description: "Currently pregnant"

    - id: breastfeeding
      name: "breastfeeding"
      display_name: "Breastfeeding"
      severity: moderate
      description: "Currently breastfeeding"

    - id: blood_thinners
      name: "blood_thinners"
      display_name: "Blood Thinning Medication"
      severity: high
      description: "Taking anticoagulants or blood thinners"

    - id: high_blood_pressure
      name: "high_blood_pressure"
      display_name: "High Blood Pressure"
      severity: moderate
      description: "Hypertension"

    - id: anxiety_disorder
      name: "anxiety_disorder"
      display_name: "Anxiety Disorder"
      severity: moderate
      description: "Diagnosed anxiety disorder"

    - id: caffeine_sensitivity
      name: "caffeine_sensitivity"
      display_name: "Caffeine Sensitivity"
      severity: moderate
      description: "Sensitivity to caffeine"

# ============================================================================
# EDGES - Relationships between nodes
# ============================================================================
edges:
  # PROBLEM → REQUIRES_KNOWING → ATTRIBUTE
  problem_requires_attributes:
    - from: brain_fog
      to: [sleep_quality, stress_level, caffeine_intake, cognitive_demand]
      relationship: REQUIRES_KNOWING

    - from: poor_concentration
      to: [cognitive_demand, work_type, sleep_quality, caffeine_intake]
      relationship: REQUIRES_KNOWING

    - from: memory_problems
      to: [age_group, sleep_quality, stress_level]
      relationship: REQUIRES_KNOWING

    - from: mental_fatigue
      to: [cognitive_demand, sleep_quality, stress_level]
      relationship: REQUIRES_KNOWING

  # INGREDIENT → TREATS → PROBLEM
  ingredient_treats_problem:
    # Omega-3 for brain health
    - from: omega_3_dha
      to: brain_fog
      relationship: TREATS
      efficacy: 0.75
      mechanism: "DHA is primary structural fat in brain supporting cognitive function"
      evidence_level: "clinical_trial"
      onset: "4-12 weeks"

    - from: omega_3_dha
      to: memory_problems
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Supports hippocampal function for memory"
      evidence_level: "clinical_trial"
      onset: "8-12 weeks"

    - from: omega_3_dha
      to: age_related_decline
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Neuroprotective effects slow cognitive decline"
      evidence_level: "clinical_trial"
      onset: "12-24 weeks"

    # Lion's Mane for neurogenesis
    - from: lions_mane
      to: memory_problems
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Stimulates NGF production for neuron growth and repair"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    - from: lions_mane
      to: brain_fog
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Enhances cognitive clarity through neurogenesis"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    - from: lions_mane
