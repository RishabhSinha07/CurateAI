  # INGREDIENT → RECOMMENDED_FOR → ATTRIBUTE
  ingredient_recommended_for_attribute:
    - from: omega_3_dha
      to: [age_group:46_60, age_group:60_plus, cognitive_demand:high]
      relationship: RECOMMENDED_FOR

    - from: lions_mane
      to: [age_group:36_45, age_group:46_60, age_group:60_plus]
      relationship: RECOMMENDED_FOR

    - from: caffeine_theanine_stack
      to: [cognitive_demand:high, cognitive_demand:very_high, work_type:knowledge_work]
      relationship: RECOMMENDED_FOR

    - from: b_complex_brain
      to: [mental_fatigue, cognitive_demand:high]
