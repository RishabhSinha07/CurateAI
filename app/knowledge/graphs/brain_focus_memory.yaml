    - from: caffeine_theanine_stack
      to: poor_concentration
      relationship: TREATS
      efficacy: 0.85
      mechanism: "Caffeine boosts alertness while theanine promotes calm focus"
      evidence_level: "clinical_trial"
      onset: "30-60 minutes"

    - from: caffeine_theanine_stack
      to: mental_fatigue
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Synergistic combination enhances mental energy without jitters"
      evidence_level: "clinical_trial"
      onset: "30-60 minutes"

    - from: l_theanine_focus
      to: poor_concentration
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Increases alpha waves for relaxed focused attention"
      evidence_level: "clinical_trial"
      onset: "30-60 minutes"

    # Bacopa for memory
    - from: bacopa_monnieri
      to: memory_problems
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Enhances synaptic communication and memory consolidation"
      evidence_level: "meta_analysis"
      onset: "8-12 weeks"

    - from: bacopa_monnieri
      to: learning_difficulties
      relationship: TREATS
      efficacy: 0.75
      mechanism: "Improves information processing and retention"
      evidence_level: "clinical_trial"
      onset: "8-12 weeks"

    # Ginkgo for cerebral blood flow
    - from: ginkgo_biloba
      to: brain_fog
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Increases cerebral blood flow and oxygen delivery"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    - from: ginkgo_biloba
      to: memory_problems
      relationship: TREATS
      efficacy: 0.70
      mechanism: "Improves blood flow to brain regions involved in memory"
      evidence_level: "clinical_trial"
      onset: "4-8 weeks"

    # Citicoline for focus and memory
    - from: citicoline
      to: poor_concentration
      relationship: TREATS
      efficacy: 0.80
      mechanism: "Increases acetylcholine for enhanced focus and attention"
      evidence_level: "clinical_trial"
      onset: "2-4 weeks"

    - from: citicoline
      to: memory_problems
      relationship: TREATS
      efficacy: 0.75
