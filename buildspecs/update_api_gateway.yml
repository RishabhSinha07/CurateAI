version: 0.2
phases:
  build:
    commands:
      - echo "Getting ECS task IP"
      - TASK_ARN=$(aws ecs list-tasks --cluster $CLUSTER_NAME --service-name $SERVICE_NAME --desired-status RUNNING --region $AWS_DEFAULT_REGION --query 'taskArns[0]' --output text)
      - test "$TASK_ARN" != "None" && test -n "$TASK_ARN" || (echo "No running tasks found!" && exit 1)
      - ENI_ID=$(aws ecs describe-tasks --cluster $CLUSTER_NAME --tasks $TASK_ARN --region $AWS_DEFAULT_REGION --output json | jq -r '.tasks[0].attachments[0].details[] | select(.name=="networkInterfaceId") | .value')
      - IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI_ID --region $AWS_DEFAULT_REGION --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
      - echo "New task IP $IP"
      - API_ID=$(aws apigatewayv2 get-apis --region $AWS_DEFAULT_REGION --output json | jq -r --arg name "$API_NAME" '.Items[] | select(.Name==$name) | .ApiId')
      - test -n "$API_ID" || (echo "API Gateway not found, skipping update" && exit 0)
      - echo "API ID $API_ID"
      - |
        INTEGRATIONS=$(aws apigatewayv2 get-integrations --api-id "$API_ID" --region "$AWS_DEFAULT_REGION")
        BASE="http://$IP:8000"

        # Update all integrations by matching their current URI path
        echo "$INTEGRATIONS" | jq -r '.Items[] | "\(.IntegrationId) \(.IntegrationUri)"' | while read ID URI; do
          # Extract the path from the current URI (e.g., http://old-ip:8000/chat -> /chat)
          PATH_PART=$(echo "$URI" | sed 's|http://[^/]*||')
          if [ -n "$PATH_PART" ]; then
            NEW_URI="${BASE}${PATH_PART}"
            case "$PATH_PART" in
              /chat|/chat/register)
                # Widget routes sit behind the Lambda authorizer. Re-assert the
                # mapping that forwards its context to the backend so a redeploy
                # can never drop it (missing tenant_id => silent seed-tenant
                # fallback). x-amzn-* is a reserved header namespace, so the
                # backend reads x-ca-tenant-id / x-ca-user-id instead.
                aws apigatewayv2 update-integration --api-id "$API_ID" --integration-id "$ID" --region "$AWS_DEFAULT_REGION" \
                  --integration-uri "$NEW_URI" \
                  --request-parameters '{"overwrite:header.x-ca-tenant-id":"$context.authorizer.tenant_id","overwrite:header.x-ca-user-id":"$context.authorizer.user_id"}'
                ;;
              *)
                aws apigatewayv2 update-integration --api-id "$API_ID" --integration-id "$ID" --region "$AWS_DEFAULT_REGION" --integration-uri "$NEW_URI"
                ;;
            esac
            echo "Updated integration $ID: $NEW_URI"
          fi
        done
      - echo "Done - API Gateway now points to http://$IP:8000"
